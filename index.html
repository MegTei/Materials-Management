// Look up a plan by code using the ADMIN client. The dashboard's RLS policy requires
// the x-dashboard-key header, so the plain anon client returns nothing here — which
// made the target lookup silently find no plan.
async function adminLoadPlanByCode(code){
  const want=String(code||'').trim().toUpperCase();
  const client=ensureAdminClient();
  if(client){
    const{data,error}=await client.from('plans').select('data').eq('plan_code',want).limit(1);
    if(error)throw new Error(error.message);
    if(data&&data.length&&data[0].data)return data[0].data;
    return null;
  }
  return storageLoadAll().find(p=>planCode(p.id)===want)||null;
}

// Triggered from the admin Upload tab. Sets the migration signal then runs the shared importer.
// If a target Plan ID was entered, that plan is loaded from the cloud and refreshed
// in place (keeping its Plan ID); otherwise a brand-new plan is created as before.
async function adminUploadXLS(input,roleType){
  const msgEl=document.getElementById('admin-xls-'+roleType+'-msg');
  const say=(t,bad)=>{if(msgEl){msgEl.textContent=t;msgEl.style.color=bad?'#A32D2D':'#888';}if(t)showToast(t);};
  const reset=()=>{try{input.value='';}catch(e){}};

  try{
    if(!input.files||!input.files.length){say('No file selected.',true);return;}
    const tgtEl=document.getElementById('admin-xls-target');
    const code=tgtEl?tgtEl.value.trim().toUpperCase():'';
    S.adminUploadTargetId=null;

    if(code){
      if(code.replace(/[^A-Z0-9]/g,'').length<8){
        say('Enter a full Plan ID (format: AO27-XXXX-XXXX)',true);reset();return;
      }
      say('Looking up '+code+'\u2026');
      let target=null;
      try{ target=await adminLoadPlanByCode(code); }
      catch(e){ say('Lookup failed: '+e.message,true);reset();return; }
      if(!target){ say('Plan '+code+' not found.',true);reset();return; }

      const who=(target.profile&&target.profile.businessName)?target.profile.businessName:'this plan';
      const n=(target.assets||[]).length;
      if(!confirm('Replace the asset list in '+planCode(target.id)+' ('+who+')?\n\n'
        +n+' existing asset'+(n===1?'':'s')+' will be replaced by the contents of this file. '
        +'The Plan ID and business details are kept. This cannot be undone.')){
        say('Cancelled.');reset();return;
      }
      S.plan=JSON.parse(JSON.stringify(target));
      S.adminUploadTargetId=planCode(target.id);
      say('Updating '+planCode(target.id)+'\u2026');
    }else{
      S.plan=newPlan();
      say('Creating a new plan\u2026');
    }
    S.plan.roleType=roleType;
    S.xlsUpdateTargetId=null;            // admin upload is not the update-by-file-ID flow
    S.gate={roleType:roleType,mode:'import'};
    importPlanXLS(input);
  }catch(err){
    console.error('Admin upload failed:',err);
    say('Upload failed: '+((err&&err.message)||err),true);
    reset();
  }
}

// ── Example-plan exclusion (shared by dashboard + CSV export) ──────────────────
// The example/seed plan must never appear in the admin portal. It is identified
// primarily by its stable Plan ID (code); email + _example flag are kept as
// secondary fallbacks in case the code ever changes.
const EXAMPLE_PLAN_CODES=['AO27-MPEQ-H0C7'];
const EXAMPLE_EMAILS=['jamie@studioconstruct.com.au'];
function isExamplePlan(p){
  if(!p)return false;
  if(p._example)return true;
  if(p.id && EXAMPLE_PLAN_CODES.includes(planCode(p.id)))return true;
  const email=(p.profile&&p.profile.email||'').toLowerCase().trim();
  return EXAMPLE_EMAILS.includes(email);
}

async function loadAdminPlans(){
  // Admin portal is CLOUD-AUTHORITATIVE when Supabase is configured.
  // It must reflect exactly what is in the `plans` table — including an empty
  // result — and must NOT blend in this browser's localStorage, otherwise
  // stale/deleted plans (and the example plan) reappear and Supabase deletions
  // never show up in the dashboard.
  // Reads go through the admin client, which carries the x-dashboard-key header
  // required by the dashboard_authed() RLS policy. Without a valid password the
  // database returns zero rows, so the gate is enforced server-side.
  const client = ensureAdminClient();
  if(client){
    const{data,error}=await client.from('plans')
      .select('data,updated_at')
      .order('updated_at',{ascending:false})
      .limit(300);
    if(error){
      // Surface the failure instead of silently falling back to local data.
      throw new Error('CLOUD_LOAD_FAILED: '+error.message);
    }
    // Return cloud rows verbatim (an empty array is a valid, authoritative answer).
    return (data||[]).map(row=>row.data).filter(Boolean);
  }
  // Only when Supabase was never configured do we use local storage.
  return storageLoadAll();
}

// Single entry point for the admin dashboard: loads plans and renders, or
// shows an explicit error panel if the authoritative cloud load fails — so we
// never silently display a stale/empty list that looks like real data.
function loadAdminPlansInto(){
  loadAdminPlans()
    .then(function(plans){
      // Cache the loaded set so admin actions (e.g. the bump-out roll-forward)
      // operate on the same authoritative data the dashboard is rendering.
      S._adminPlans=plans;
      renderAdminDashboard(plans);
    })
    .catch(err=>renderAdminError(err));
}

function renderAdminError(err){
  const main=document.getElementById('main');if(!main)return;
  const msg=esc((err&&err.message)||'Unknown error');
  let h='<div class="admin-hero"><h2 style="font-size:20px;font-weight:800;color:#fff;margin-bottom:.4rem">Admin Dashboard</h2>';
  h+='<p style="font-size:12px;opacity:.85">Could not load plans from the cloud.</p></div>';
  h+='<div class="admin-section">';
  h+='<div class="hbox" style="background:#FCEBEB;border-color:#f5c6c6;color:#A32D2D">';
  h+='Plans could not be loaded from Supabase, so nothing is shown (rather than risk displaying out-of-date local copies). ';
  h+='Check your connection and try again.<br><span style="font-size:11px;opacity:.8">Details: '+msg+'</span></div>';
  h+='<button onclick="loadAdminPlansInto()" class="btn-primary" style="padding:9px 18px">Retry</button>';
  h+='<button onclick="adminSignOut()" style="margin-left:8px;font-size:12px;padding:9px 16px;border:1px solid #ddd;color:#555;background:#fff;border-radius:7px;cursor:pointer">Sign out</button>';
  h+='</div>';
  main.innerHTML=h;
}

function renderAdminDashboard(rawPlans){
  // EXCLUDE the example plan from all admin data (see isExamplePlan above —
  // keyed on Plan ID AO27-MPEQ-H0C7, with email/_example as fallbacks).
  const allPlans=rawPlans.filter(p=>!isExamplePlan(p));

  // ── Year filter ──────────────────────────────────────────────────────────
  const years=[...new Set(allPlans.map(p=>p.profile&&p.profile.aoYear?p.profile.aoYear:'Unknown'))].sort();
  let selYear=sessionStorage.getItem('adminYear')||'all';
  if(selYear!=='all'&&!years.includes(selYear))selYear='all';
  const filtered=selYear==='all'?allPlans:allPlans.filter(p=>(p.profile&&p.profile.aoYear?p.profile.aoYear:'Unknown')===selYear);

  // ── Source badge ─────────────────────────────────────────────────────────
  const sourceBadge=SUPABASE_READY
    ?'<span style="background:#E1F5EE;color:#0F6E56;border:1px solid #b2e8d2;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px">&#9679; Live cloud</span>'
    :'<span style="background:#FAEEDA;color:#854F0B;border:1px solid #f5ddb7;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px">&#9679; Local only</span>';

  let h='';

  // ── Hero header ───────────────────────────────────────────────────────────
  h+='<div class="admin-hero">';
  h+='<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">';
  h+='<div>';
  h+='<div style="font-size:10px;font-weight:800;letter-spacing:.12em;color:rgba(255,255,255,.55);text-transform:uppercase;margin-bottom:4px">Australian Open</div>';
  h+='<h2 style="font-size:20px;font-weight:800;color:#fff;margin-bottom:.4rem;letter-spacing:-.02em">Admin Dashboard</h2>';
  h+='<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'+sourceBadge;
  h+='<span style="font-size:12px;color:rgba(255,255,255,.65)">'+allPlans.length+' plan'+(allPlans.length===1?'':'s')+' total</span>';
  h+='</div></div>';
  h+='<button onclick="adminSignOut()" style="font-size:11px;padding:6px 14px;color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.25);border-radius:7px;cursor:pointer;background:rgba(255,255,255,.1);flex-shrink:0;margin-top:2px">Sign out</button>';
  h+='</div></div>';
  h+=adminSubTabBar('dashboard',false);

  // ── Bump-out roll-forward ─────────────────────────────────────────────────
  // Once all bump-out data is in, promote every asset's "New serial number"
  // into "Current serial number" and clear the new field, ready for next year.
  // Counted across ALL plans (not the year filter) so the roll-forward is complete.
  const pendingCount=allPlans.reduce((n,p)=>n+(p.assets||[]).filter(a=>String(a.serialNumberNew||'').trim()).length,0);
  h+='<div class="admin-section" style="padding-top:0;padding-bottom:1rem">';
  h+='<div style="background:#fff;border:1px solid #e8e5de;border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap">';
  h+='<div style="flex:1;min-width:240px">';
  h+='<div style="font-size:13px;font-weight:700;color:#0C1B47;margin-bottom:3px">Bump-out roll-forward</div>';
  h+='<div style="font-size:12px;color:#666;line-height:1.5">Promotes <strong>New serial number</strong> &rarr; <strong>Current serial number</strong> across all plans and clears the new field. Run once all bump-out data is complete. Assets with no new serial are left untouched.</div>';
  h+='</div>';
  if(pendingCount>0){
    h+='<div style="text-align:right"><div style="font-size:20px;font-weight:800;color:#0091D2;line-height:1">'+pendingCount+'</div><div style="font-size:11px;color:#888">awaiting promotion</div></div>';
    h+='<button onclick="promoteSerialNumbers()" style="font-size:12px;font-weight:700;padding:9px 18px;border-radius:8px;cursor:pointer;border:1.5px solid #0072A8;background:#0091D2;color:#fff;font-family:inherit;flex-shrink:0">Promote '+pendingCount+' serial number'+(pendingCount===1?'':'s')+'</button>';
  }else{
    h+='<span style="font-size:12px;font-weight:700;color:#0F6E56;background:#E1F5EE;border:1px solid #b2e8d2;border-radius:8px;padding:7px 14px;flex-shrink:0">Nothing to promote</span>';
  }
  h+='</div></div>';

  // ── Year filter ───────────────────────────────────────────────────────────
  if(years.length){
    h+='<div class="admin-section" style="padding-top:1rem;padding-bottom:1rem">';
    h+='<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">';
    h+='<span style="font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.06em;margin-right:4px">Year</span>';
    const tabStyle=(active)=>'font-size:12px;font-weight:700;padding:5px 14px;border-radius:20px;cursor:pointer;border:1.5px solid '+(active?'#0091D2':'#d0cdc7')+';background:'+(active?'#0091D2':'#fff')+';color:'+(active?'#fff':'#555');
    h+='<button style="'+tabStyle(selYear==="all")+'" onclick="sessionStorage.setItem(&quot;adminYear&quot;,&quot;all&quot;);loadAdminPlansInto()">All years ('+allPlans.length+')</button>';
    for(const yr of years){
      const cnt=allPlans.filter(p=>(p.profile&&p.profile.aoYear?p.profile.aoYear:'Unknown')===yr).length;
      h+='<button style="'+tabStyle(selYear===yr)+'" onclick="sessionStorage.setItem(&quot;adminYear&quot;,&quot;'+yr+'&quot;);loadAdminPlansInto()">'+esc(yr)+' ('+cnt+')</button>';
    }
    h+='</div></div>';
  }

  // ── Empty state ───────────────────────────────────────────────────────────
  if(!filtered.length){
    h+='<div style="padding:1.25rem 1rem">';
    h+='<div style="background:#fff;border:1px solid #e8e5de;border-radius:10px;padding:2.5rem;text-align:center;color:#888;font-size:13px">';
    h+=allPlans.length?'No plans for this year yet.':SUPABASE_READY?'No plans in the database yet.':'No plans saved in this browser yet.';
    h+='</div></div>';
    document.getElementById('main').innerHTML=h;
    return;
  }

  // ── Core metrics ──────────────────────────────────────────────────────────
  const totalAssets=filtered.reduce((n,p)=>n+(p.assets||[]).length,0);
  const allMats=filtered.flatMap(p=>(p.assets||[]).flatMap(a=>a.materials||[]));
  const withStat=allMats.filter(m=>m.stat);
  const withActual=allMats.filter(m=>m.outcome&&m.outcome!=='');
  // Plan-weighted average across submitted plans (each plan counts equally).
  // A plan's score = circular materials / materials with a status (unsure counts as not circular),
  // so a plan with no circular data scores 0%. Plans with zero materials are skipped.
  // The headline is a dash only when no plan has any data for that field.
  function planWeightedPct(field){
    let sum=0,n=0,anyData=false;
    for(const p of filtered){
      const mats=(p.assets||[]).flatMap(a=>a.materials||[]);
      if(!mats.length)continue;            // empty plan – not a participant
      n++;
      const s=circStats(mats,field);
      if(s.pctExact!=null){anyData=true;sum+=s.pctExact;} // no data for this field → contributes 0
    }
    if(!n||!anyData)return null;
    return sum/n; // exact average; format with pctText for display
  }
  const pct=planWeightedPct('stat');
  const actualPct=planWeightedPct('outcome');

  h+='<div class="admin-section">';
  h+='<div class="sechd sechd-first">Snapshot</div>';
  h+='<div class="metg" style="grid-template-columns:repeat(4,1fr)">';
  h+='<div class="met"><div class="mval">'+filtered.length+'</div><div class="mlbl">Plans submitted</div></div>';
  h+='<div class="met"><div class="mval">'+totalAssets+'</div><div class="mlbl">Total assets</div></div>';
  h+='<div class="met"><div class="mval" style="color:'+(pct==null?'#9ca3af':fillClr(pct))+'">'+pctText(pct)+'</div><div class="mlbl">Planned circularity</div></div>';
  h+='<div class="met"><div class="mval" style="color:'+(actualPct==null?'#9ca3af':fillClr(actualPct))+'">'+pctText(actualPct)+'</div><div class="mlbl">Actual circularity</div></div>';
  h+='</div></div>';

  // ── TML adoption ──────────────────────────────────────────────────────────
  const tmlMats=allMats.filter(m=>m.tmlRef&&m.tmlRef!=='OTHER');
  const otherMats=allMats.filter(m=>!m.tmlRef||m.tmlRef==='OTHER');
  const tmlPct=allMats.length?Math.round(tmlMats.length/allMats.length*100):0;

  // AO-recommended TML vs not recommended
  const tmlYes=tmlMats.filter(m=>{const t=TML.find(x=>x.ref===m.tmlRef);return t&&t.status==='yes';});
  const tmlNo=tmlMats.filter(m=>{const t=TML.find(x=>x.ref===m.tmlRef);return t&&t.status==='no';});
  const tmlMaybe=tmlMats.filter(m=>{const t=TML.find(x=>x.ref===m.tmlRef);return t&&t.status==='maybe';});
  const tmlYesPct=allMats.length?Math.round(tmlYes.length/allMats.length*100):0;
  const tmlNoPct=allMats.length?Math.round(tmlNo.length/allMats.length*100):0;
  const tmlMaybePct=allMats.length?Math.round(tmlMaybe.length/allMats.length*100):0;
  const otherPct=allMats.length?Math.round(otherMats.length/allMats.length*100):0;

  // Materials by category (top 5)
  const catCts={};
  for(const m of allMats)if(m.cat)catCts[m.cat]=(catCts[m.cat]||0)+1;
  const topCats=Object.entries(catCts).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const catTot=allMats.filter(m=>m.cat).length;

  // Planned status breakdown
  const stCts={};
  for(const m of allMats)if(m.stat)stCts[m.stat]=(stCts[m.stat]||0)+1;

  // Actuals
  const actCts={};
  for(const m of allMats)if(m.outcome&&m.outcome!=='')actCts[m.outcome]=(actCts[m.outcome]||0)+1;

  // Circularity trend by plan (for sparkline-style list)
  const planCirc=filtered.map(p=>{
    const mats=(p.assets||[]).flatMap(a=>a.materials||[]);
    const pp=circStats(mats,'stat').pct; // null only if the plan has no status data at all
    return{name:p.profile&&p.profile.businessName?p.profile.businessName:'Unknown',pct:pp};
  }).filter(x=>x.pct!==null).sort((a,b)=>b.pct-a.pct);

  // SVG icons matching the Start Here why-card style
  const svgTarget='<svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:#0091D2;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>';
  const svgBar='<svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:#0091D2;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/></svg>';
  const svgList='<svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:#0091D2;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>';
  const svgCheck='<svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:#0091D2;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
  const svgAward='<svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:#0091D2;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/></svg>';
  const iconBox=(svg)=>'<div style="width:32px;height:32px;background:#EEF5FF;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-bottom:10px">'+svg+'</div>';

  // Insights grid ─────────────────────────────────────────────────────────────
  h+='<div class="admin-section alt">';
  h+='<div class="sechd sechd-first">Insights</div>';
  h+='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px">';

  // Insight A: TML adoption — AO Target List vs Other
  h+='<div class="insight-card">';
  h+=iconBox(svgTarget);
  h+='<div class="insight-label" style="color:#003A5D">AO Target List vs Other</div>';
  // Big % hero
  h+='<div style="display:flex;align-items:baseline;gap:6px;margin-bottom:10px">';
  h+='<span style="font-size:28px;font-weight:800;color:#0091D2">'+tmlPct+'%</span>';
  h+='<span style="font-size:12px;color:#888">materials from AO Target List</span>';
  h+='</div>';
  // Progress bar
  h+='<div style="height:8px;border-radius:4px;background:#e8e5de;overflow:hidden;margin-bottom:10px;display:flex">';
  h+='<div style="background:#33D900;width:'+tmlYesPct+'%;transition:width .5s" title="Recommended"></div>';
  h+='<div style="background:#f5c200;width:'+tmlMaybePct+'%;transition:width .5s" title="Conditional"></div>';
  h+='<div style="background:#e05252;width:'+tmlNoPct+'%;transition:width .5s" title="Not recommended"></div>';
  h+='<div style="background:#ccc;width:'+otherPct+'%;transition:width .5s" title="Not on list"></div>';
  h+='</div>';
  const tmlRows=[
    {label:'AO Recommended',n:tmlYes.length,pct:tmlYesPct,col:'#33D900'},
    {label:'Conditional',n:tmlMaybe.length,pct:tmlMaybePct,col:'#f5c200'},
    {label:'Not recommended',n:tmlNo.length,pct:tmlNoPct,col:'#e05252'},
    {label:'Not on Target List',n:otherMats.length,pct:otherPct,col:'#ccc'},
  ];
  for(const r of tmlRows){
    h+='<div class="insight-row"><div class="insight-dot" style="background:'+r.col+'"></div><div style="flex:1;color:#333">'+r.label+'</div><div style="color:#888;font-size:11px;margin-right:8px">'+r.n+' ('+r.pct+'%)</div><div class="insight-bar-wrap"><div class="insight-bar" style="background:'+r.col+';width:'+r.pct+'%"></div></div></div>';
  }
  h+='</div>';

  // Insight B: Top material categories
  h+='<div class="insight-card">';
  h+=iconBox(svgBar);
  h+='<div class="insight-label" style="color:#003A5D">Top material categories</div>';
  if(topCats.length){for(let i=0;i<topCats.length;i++){
    const[cat,cnt]=topCats[i];
    const pp=catTot?Math.round(cnt/catTot*100):0;
    h+='<div class="insight-row"><span style="color:#aaa;font-size:10px;width:14px;flex-shrink:0">'+(i+1)+'</span><span style="flex:1;color:#333;font-weight:'+(i===0?700:400)+';overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(cat)+'</span><span style="color:#888;font-size:11px;margin-right:8px">'+pp+'%</span><div class="insight-bar-wrap"><div class="insight-bar" style="background:#0091D2;width:'+pp+'%"></div></div></div>';
  }}
  else h+='<div style="color:#aaa;font-size:12px;padding-top:4px">No data yet.</div>';
  h+='</div>';

  // Insight C: Materials by planned status
  h+='<div class="insight-card">';
  h+=iconBox(svgList);
  h+='<div class="insight-label" style="color:#003A5D">Materials by planned status</div>';
  if(withStat.length){const tot=withStat.length;for(const[s,n]of Object.entries(stCts).sort((a,b)=>b[1]-a[1])){const pp=Math.round(n/tot*100);const col=STCOL_ADMIN[s]||'#9ca3af';h+='<div class="insight-row"><div class="insight-dot" style="background:'+col+'"></div><div style="flex:1;font-size:12px;color:#333">'+esc(s)+'</div><div style="color:#888;font-size:11px;margin-right:8px">'+pp+'%</div><div class="insight-bar-wrap"><div class="insight-bar" style="background:'+col+';width:'+pp+'%"></div></div></div>';}}
  else h+='<div style="color:#aaa;font-size:12px;padding-top:4px">No status data yet.</div>';
  h+='</div>';

  // Insight D: Post-event actuals
  h+='<div class="insight-card">';
  h+=iconBox(svgCheck);
  h+='<div class="insight-label" style="color:#003A5D">Post-event actuals</div>';
  if(withActual.length){const tot=withActual.length;for(const[s,n]of Object.entries(actCts).sort((a,b)=>b[1]-a[1])){const pp=Math.round(n/tot*100);const col=STCOL_ADMIN[s]||'#9ca3af';h+='<div class="insight-row"><div class="insight-dot" style="background:'+col+'"></div><div style="flex:1;font-size:12px;color:#333">'+esc(s)+'</div><div style="color:#888;font-size:11px;margin-right:8px">'+pp+'%</div><div class="insight-bar-wrap"><div class="insight-bar" style="background:'+col+';width:'+pp+'%"></div></div></div>';}}
  else h+='<div style="color:#aaa;font-size:12px;padding-top:4px;text-align:center">Post-event actuals will appear here once bump-out data is recorded.</div>';
  h+='</div>';

  // Insight E: Circularity leaders
  h+='<div class="insight-card">';
  h+=iconBox(svgAward);
  h+='<div class="insight-label" style="color:#003A5D">Circularity by business</div>';
  if(planCirc.length){for(let i=0;i<Math.min(planCirc.length,5);i++){const p2=planCirc[i];const col=fillClr(p2.pct);h+='<div class="insight-row"><span style="color:#aaa;font-size:10px;width:14px;flex-shrink:0">'+(i+1)+'</span><span style="flex:1;color:#333;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(p2.name)+'</span><span style="color:'+col+';font-weight:700;font-size:12px;margin-right:8px">'+p2.pct+'%</span><div class="insight-bar-wrap"><div class="insight-bar" style="background:'+col+';width:'+p2.pct+'%"></div></div></div>';}}
  else h+='<div style="color:#aaa;font-size:12px;padding-top:4px">No circularity data yet.</div>';
  h+='</div>';

  h+='</div></div>'; // end insights grid + section

  // ── Plans table ───────────────────────────────────────────────────────────
  h+='<div class="admin-section">';
  h+='<div class="sechd sechd-first">Submitted plans ('+filtered.length+')</div>';
  h+='<div style="overflow-x:auto;margin-bottom:1.5rem"><table class="admin-table">';
  h+='<thead><tr><th>Business</th><th>Contact</th><th>Year</th><th>Plan ID</th><th>Assets</th><th>Circularity</th><th>Last saved</th></tr></thead>';
  h+='<tbody>';
  for(const p of filtered){
    const assets=p.assets||[];
    const mats=assets.flatMap(a=>a.materials||[]);
    const sc=calcScore(assets);
    const _noSc=sc.total===0;
    const statBg=_noSc?'#f1f1f1':sc.pct>=80?'#EEF9F4':sc.pct>=50?'#FFF8EE':'#FCEBEB';
    const statCol=_noSc?'#9ca3af':sc.pct>=80?'#0F6E56':sc.pct>=50?'#854F0B':'#A32D2D';
    const code=planCode(p.id);
    const yr=p.profile&&p.profile.aoYear?p.profile.aoYear:'—';
    h+='<tr>';
    h+='<td><strong>'+esc(p.profile&&p.profile.businessName?p.profile.businessName:'Unnamed')+'</strong><br><span style="color:#aaa;font-size:10px">'+esc(p.profile&&p.profile.role?p.profile.role:'')+'</span></td>';
    h+='<td><div>'+esc(p.profile&&p.profile.ownerName?p.profile.ownerName:'-')+'</div><div style="color:#888;font-size:10px">'+esc(p.profile&&p.profile.email?p.profile.email:'')+'</div></td>';
    h+='<td><span style="font-size:12px;font-weight:700;color:#0091D2">'+esc(yr)+'</span></td>';
    h+='<td><span style="font-family:monospace;font-size:11px;color:#0091D2;font-weight:700">'+code+'</span></td>';
    h+='<td>'+assets.length+' assets<br><span style="color:#aaa;font-size:10px">'+mats.length+' mats</span></td>';
    h+='<td><span class="admin-stat" style="background:'+statBg+';color:'+statCol+'">'+(_noSc?'-':pctText(sc.pctExact))+'</span></td>';
    h+='<td style="white-space:nowrap;font-size:11px">'+fmtDate(p.lastEditedAt||p.savedAt)+'<br><span style="color:#aaa">'+esc(p.lastEditedBy||'')+'</span></td>';
    h+='</tr>';
  }
  h+='</tbody></table></div>';

  h+='</div>'; // close plans admin-section

  // ── Actions ───────────────────────────────────────────────────────────────
  h+='<div class="admin-section" style="display:flex;gap:8px;flex-wrap:wrap">';
  h+='<button onclick="exportAdminCSV()" style="font-size:12px;padding:8px 16px;border:1px solid #0091D2;color:#0091D2;background:#EEF5FF;border-radius:7px;cursor:pointer">Export all plans as CSV</button>';
  if(SUPABASE_READY)h+='<button onclick="loadAdminPlansInto()" style="font-size:12px;padding:8px 16px;border:1px solid #ddd;color:#555;background:#fff;border-radius:7px;cursor:pointer">Refresh</button>';
  h+='</div>'; // close actions admin-section

  document.getElementById('main').innerHTML=h;
}

// ── Forecast dashboard (separate from the materials-plan dashboard above, kept
// in its own admin sub-tab, but built with the exact same layout/CSS classes —
// admin-hero, admin-section, .metg/.met, .insight-card/.insight-row/.insight-bar,
// .admin-table — so it reads as the same dashboard, just a different dataset) ──
async function loadAdminForecasts(){
  const client=ensureAdminClient();
  if(client){
    const{data,error}=await client.from('forecasts')
      .select('data,updated_at')
      .order('updated_at',{ascending:false})
      .limit(300);
    if(error){
      throw new Error('CLOUD_LOAD_FAILED: '+error.message);
    }
    return (data||[]).map(row=>row.data).filter(Boolean);
  }
  return fcStorageLoadAll();
}
function loadAdminForecastsInto(){
  loadAdminForecasts()
    .then(function(forecasts){
      S._adminForecasts=forecasts;
      renderAdminFcDashboard(forecasts);
    })
    .catch(err=>renderAdminFcError(err));
}
function renderAdminFcError(err){
  const main=document.getElementById('main');if(!main)return;
  const msg=esc((err&&err.message)||'Unknown error');
  let h='<div class="admin-hero"><h2 style="font-size:20px;font-weight:800;color:#fff;margin-bottom:.4rem">Forecast Dashboard</h2>';
  h+='<p style="font-size:12px;opacity:.85">Could not load forecasts from the cloud.</p></div>';
  h+='<div class="admin-section">';
  h+='<div class="hbox" style="background:#FCEBEB;border-color:#f5c6c6;color:#A32D2D">';
  h+='Forecasts could not be loaded from Supabase, so nothing is shown (rather than risk displaying out-of-date local copies). ';
  h+='Check your connection and try again.<br><span style="font-size:11px;opacity:.8">Details: '+msg+'</span></div>';
  h+='<button onclick="loadAdminForecastsInto()" class="btn-primary" style="padding:9px 18px">Retry</button>';
  h+='<button onclick="adminSignOut()" style="margin-left:8px;font-size:12px;padding:9px 16px;border:1px solid #ddd;color:#555;background:#fff;border-radius:7px;cursor:pointer">Sign out</button>';
  h+='</div>';
  main.innerHTML=h;
}

function exportAdminFcCSV(){
  loadAdminForecasts().then(forecasts=>{
    if(!forecasts.length){showToast('No forecasts to export');return;}
    const rows=[['Organisation','Website','Project','Role','Contact name','Contact email','Event year','TA-ID','Asset name','Material','Expected volume','Unit','Expected status','Actual material status (Bump-out)','Receiving org (Donate)','Take-back program name']];
    for(const f of forecasts){
      const code=fcCode(f.id);
      for(const m of (f.materials||[])){
        rows.push([
          f.profile.org||'',f.profile.website||'',f.profile.project||'',f.profile.role||'',f.profile.contactName||'',f.profile.contactEmail||'',
          f.profile.eventYear||'',code,
          m.assetName||'',m.detail==='Other'?(m.detailOther||'Other'):(m.detail||''),m.vol||'',m.vunit||'',m.stat||'',fcMatOutcome(m),
          m.receivingOrg||'',m.takeBackProgram||(m.actual&&(m.actual.takeBackProgram||m.actual.takeBackNote))||''
        ]);
      }
    }
    const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='ao27-forecasts.csv';a.click();
    URL.revokeObjectURL(url);
  }).catch(()=>showToast('Export failed — could not load forecasts from cloud'));
}

// Validate the typed dashboard password by attempting a gated read against
// Supabase. The dashboard_authed() RLS policy returns rows only when the
// x-dashboard-key header matches the hashed password stored server-side, so a
// successful query (no error) proves the password is correct. No password is
// stored in this file.
async function checkAdminPin(){
  const val=document.getElementById('admin-pin');
  const msg=document.getElementById('admin-login-msg');
  if(!val)return;
  const key=val.value;
  if(!key){if(msg)msg.textContent='Enter the dashboard password.';return;}

  // If Supabase isn't available, fall back to local-only mode (offline use).
  if(!sb){
    sessionStorage.setItem(ADMIN_KEY_SS, key);
    renderAdmin();
    return;
  }

  const btn=document.querySelector('.admin-login .btn-primary');
  if(btn){btn.disabled=true;btn.textContent='Checking...';}
  if(msg){msg.style.color='#888';msg.textContent='Checking password...';}

  const probe=buildAdminClient(key);
  try{
    // HEAD count request: returns a count when the gate passes, 0 rows / no
    // error is also a pass (valid empty table). A wrong password trips the RLS
    // policy and Supabase returns an error, which we treat as "denied".
    const{error}=await probe.from('plans').select('id',{count:'exact',head:true});
    if(error) throw error;
    // Password accepted — persist for the session and promote the admin client.
    sessionStorage.setItem(ADMIN_KEY_SS, key);
    sbAdmin=probe;
    renderAdmin();
  }catch(err){
    if(msg){msg.style.color='#A32D2D';msg.textContent='Incorrect password.';}
    if(val){val.style.borderColor='#dc2626';val.value='';val.focus();}
    if(btn){btn.disabled=false;btn.textContent='Access dashboard';}
  }
}

function exportAdminCSV(){
  loadAdminPlans().then(rawPlans=>{
    const plans=(rawPlans||[]).filter(p=>!isExamplePlan(p));
    if(!plans.length){showToast('No plans to export');return;}
  const rows=[['Business','Owner','Role','Email','Date Saved','Asset','Precinct','Material','TML Ref','Volume','Unit','Status','Outcome']];
  for(const p of plans){
    for(const a of (p.assets||[])){
      for(const m of (a.materials||[])){
        rows.push([
          p.profile.businessName||'',p.profile.ownerName||'',p.profile.role||'',p.profile.email||'',
          p.savedAt?new Date(p.savedAt).toLocaleDateString('en-AU'):'',
          a.assetName||'',
          a.prec||'',
          m.name||'',m.tmlRef||'',m.vol||'',m.vunit||'',m.stat||'',m.outcome||''
        ]);
      }
    }
  }
  const csv=rows.map(r=>r.map(v=>'"'+(String(v).replace(/"/g,'""'))+'"').join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='AO27_Materials_Plans.csv';a.click();
  URL.revokeObjectURL(url);
  }).catch(err=>showToast('Export failed — could not load plans from cloud'));
}

function renderForm(){

  const sn=['About you','Assets & Materials','Summary'];
  const segs=sn.map((_,i)=>`<div class="seg ${i<step?'done':i===step?'active':''}"></div>`).join('');
  const lbls=sn.map((n,i)=>`<div class="plbl ${i<step?'done':i===step?'active':''}">${n}</div>`).join('');
  let c=`<div style="margin-bottom:1.25rem"><div class="prog-segs">${segs}</div><div class="prog-lbls">${lbls}</div></div>`;

  else if(step===1)c+=stepAssets(plan);
  else c+=stepSummary(plan);
  document.getElementById('main').innerHTML=c;
}

function saveAbout(){
  const g=id=>{const e=document.getElementById(id);return e?e.value.trim():''};

  const roleVal=document.getElementById('p-role')?document.getElementById('p-role').value:'';
  // Mandatory fields OFF for TA branch and example/demo plans; Agency/Builder/Partner stay required.
  const lenient=TA_ROLES.includes(roleVal)||S.plan.roleType==='TA'||S.plan.imported||S.plan._example;
  const fields=lenient?[]:[
    {id:'p-date',   label:'Date'},
    {id:'p-biz',    label:'Business name'},
    {id:'p-own',    label:'Plan owner / Contact'},
    {id:'p-email',  label:'Contact email'},
    {id:'p-role',   label:'Role in AO design & build'},
    {id:'p-editor', label:'Editor name'},
    {id:'p-waste',  label:'Waste reduction target'},
    {id:'p-reuse',  label:'Reuse target'},
    {id:'p-store',  label:'Storage details'},
    ...(TA_ROLES.includes(roleVal)?[{id:'p-dept',label:'Department'}]:[]),
  ];

  // Reset border colours
  fields.forEach(f=>{const el=document.getElementById(f.id);if(el)el.style.borderColor='';});

  // Find empty required fields
  const missing=[];
  fields.forEach(f=>{
    if(!g(f.id)){

  // Validate email format
  const emailVal=g('p-email');
  if(emailVal&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailVal)){

    const el=document.getElementById('p-email');if(el)el.style.borderColor='#dc2626';

  const errBox=document.getElementById('about-errors');
  if(missing.length){
    if(errBox){
      errBox.style.display='';
      errBox.innerHTML='<strong>Please complete all required fields before continuing:</strong>'
        +'<ul style="margin:.35rem 0 0 1.25rem;padding:0">'+missing.map(m=>'<li>'+m+'</li>').join('')+'</ul>';

function foldEvery50(items,label){
  if(!items||items.length<=50)return (items||[]).join('');
  let h='';
  for(let f=0;f<items.length;f+=50){
    const end=Math.min(f+50,items.length);
    const open=f===0;
    h+='<div class="fold-sec" style="margin-bottom:10px;border:1px solid #dde2e8;border-radius:8px;overflow:hidden">';
    h+='<button type="button" onclick="toggleFold(this)" data-open="'+(open?'1':'0')+'" aria-expanded="'+(open?'true':'false')+'" style="width:100%;text-align:left;padding:10px 14px;background:#EDEEEF;border:none;cursor:pointer;font-weight:700;font-size:13px;color:#003A5D;display:flex;justify-content:space-between;align-items:center;font-family:inherit">';
    h+='<span>'+label+' '+(f+1)+'&ndash;'+end+'</span><span class="fold-chev" style="font-size:11px;color:#888">'+(open?'&#9650;':'&#9660;')+'</span></button>';
    h+='<div class="fold-body" style="display:'+(open?'block':'none')+';padding:'+(open?'10px':'0')+'">'+items.slice(f,end).join('')+'</div>';
    h+='</div>';
  }
  return h;
}
function foldByApp(assets,items,label){
  if(!items||items.length<=50)return (items||[]).join('');
  const groups={};const order=[];
  for(let i=0;i<items.length;i++){
    const a=assets[i]||{};const m=(a.materials&&a.materials[0])||{};
    const k=(m.app&&String(m.app).trim())?m.app:'Uncategorised';
    if(!groups[k]){groups[k]=[];order.push(k);}
    groups[k].push(items[i]);
  }
  order.sort(function(x,y){return String(x).localeCompare(String(y));});
  let h='';
  for(let gi=0;gi<order.length;gi++){
    const k=order[gi];const open=false;
    h+='<div class="fold-sec" style="margin-bottom:10px;border:1px solid #dde2e8;border-radius:8px;overflow:hidden">';
    h+='<button type="button" onclick="toggleFold(this)" data-open="'+(open?'1':'0')+'" aria-expanded="'+(open?'true':'false')+'" style="width:100%;text-align:left;padding:10px 14px;background:#EDEEEF;border:none;cursor:pointer;font-weight:700;font-size:13px;color:#003A5D;display:flex;justify-content:space-between;align-items:center;font-family:inherit">';
    h+='<span>'+esc(k)+' <span style="color:#888;font-weight:400">('+groups[k].length+')</span></span><span class="fold-chev" style="font-size:11px;color:#888">'+(open?'&#9650;':'&#9660;')+'</span></button>';
    h+='<div class="fold-body" style="display:'+(open?'block':'none')+';padding:'+(open?'10px':'0')+'">'+groups[k].join('')+'</div>';
    h+='</div>';
  }
  return h;
}

function toggleFold(btn){
  const open=btn.dataset.open==='1';
  btn.dataset.open=open?'0':'1';
  btn.setAttribute('aria-expanded',open?'false':'true');
  const body=btn.nextElementSibling;
  if(body){body.style.display=open?'none':'block';body.style.padding=open?'0':'10px';}
  const chev=btn.querySelector('.fold-chev');
  if(chev)chev.innerHTML=open?'&#9660;':'&#9650;';
}

// ── Asset search ──────────────────────────────────────────────────────────────
// Matches across Asset ID, current + new serial numbers, asset name and description.
function assetMatchesQ(a,q){
  if(!q)return true;
  const hay=[a.assetId,a.serialNumber,a.serialNumberNew,a.assetName,a.desc]
    .map(function(v){return String(v||'').toLowerCase();}).join(' \u2502 ');
  return hay.indexOf(q)>=0;
}
function assetSearch(el){
  S._assetQ=String(el.value||'').trim().toLowerCase();
  refreshAssets();
}
function clearAssetSearch(){
  S._assetQ='';
  const el=document.getElementById('asset-search');
  if(el){el.value='';el.focus();}
  refreshAssets();
}

function refreshAssets(){
  const el=document.getElementById('asset-list');if(!el)return;
  const all=S.plan.assets||[];const sc=calcScore(all);const cl=fillClr(sc.pct);
  const q=S._assetQ||'';
  // Keep original positions so the "#N" reference stays stable while filtering.
  const idxs=[];for(let i=0;i<all.length;i++)if(assetMatchesQ(all[i],q))idxs.push(i);
  let h='';
  if(all.length>0){
    const allMatsCount=all.flatMap(a=>a.materials||[]).length;
    h+=`<div id="score-bar" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:12px;color:#888;margin-bottom:4px"><span>${all.length} asset${all.length!==1?'s':''} &middot; ${allMatsCount} material${allMatsCount!==1?'s':''} &middot; ${sc.nonLandfill} diverted from landfill</span><span style="font-weight:600;color:${cl}">${sc.total>0?sc.pct+'% circular':''}</span></div><div class="strack"><div class="sfill" style="width:${sc.pct}%;background:${cl}"></div></div></div>`;
    if(q)h+=`<div style="font-size:12px;color:#666;margin-bottom:10px">Showing <strong>${idxs.length}</strong> of ${all.length} assets matching &ldquo;${esc(q)}&rdquo; &middot; <a href="#" onclick="event.preventDefault();clearAssetSearch()" style="color:#0091D2;font-weight:600">clear search</a></div>`;
    if(idxs.length===0){
      h+=`<div style="text-align:center;padding:1.5rem 1rem;color:#888;font-size:13px">No assets match that search. Try an Asset ID, serial number, asset name or description.</div>`;
    }else{
      const shown=idxs.map(i=>all[i]);
      const _cards=[];for(let k=0;k<idxs.length;k++)_cards.push(assetCard(all[idxs[k]],idxs[k]));
      h+=foldByApp(shown,_cards,'Assets');
    }
  }else{
    h=`<div style="text-align:center;padding:1.5rem 1rem;color:#888;font-size:13px">No assets added yet. Use the button below to add your first asset.</div>`;
  }
  el.innerHTML=h;
}

// ── Asset images (Supabase Storage) ───────────────────────────────────────────
// Images live in a Storage bucket; the plan JSON only ever holds the public URL
// and the storage path. Keeping bytes out of the JSON is what lets a plan carry
// hundreds of images without the row growing unmanageable.
const IMAGE_EXTS=['jpg','jpeg','png','gif','webp','heic','heif'];
function imgSafeExt(name){
  const m=String(name||'').match(/\.([a-zA-Z0-9]{1,5})$/);
  const e=m?m[1].toLowerCase():'jpg';
  return IMAGE_EXTS.includes(e)?e:'jpg';
}
function imgSlug(s,max){
  return String(s||'')
    .normalize('NFKD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-zA-Z0-9]+/g,'-')
    .replace(/^-+|-+$/g,'')
    .slice(0,max||40)
    .toLowerCase();
}
// Storage keys must be URL-safe: no spaces, quotes, separators or traversal.
function imgPathFor(planId,assetId,fileName){
  const stamp=Date.now().toString(36);
  const base=imgSlug(String(fileName||'').replace(/\.[^.]*$/,''),40)||'image';
  return 'plans/'+imgSlug(planId,40)+'/'+(imgSlug(assetId,20)||'asset')+'-'+stamp+'-'+base+'.'+imgSafeExt(fileName);
}

// Downscale oversized images in the browser before upload. Falls back to the
// original file if anything goes wrong — a bigger upload beats a failed one.
function imgDownscale(file){
  return new Promise(function(resolve){
    if(!/^image\//.test(file.type)||/heic|heif/i.test(file.type)){resolve(file);return;}
    const url=URL.createObjectURL(file);
    const im=new Image();
    im.onload=function(){
      try{
        const longest=Math.max(im.width,im.height);
        if(longest<=IMAGE_MAX_DIM){URL.revokeObjectURL(url);resolve(file);return;}
        const scale=IMAGE_MAX_DIM/longest;
        const c=document.createElement('canvas');
        c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        const isPng=/png/i.test(file.type);
        c.toBlob(function(blob){
          URL.revokeObjectURL(url);
          // Zero the canvas before dropping it. Safari/iOS accounts canvas backing
          // stores outside the JS heap and is slow to reclaim them, so on a run of
          // several hundred photos the un-zeroed canvases are what actually pushes
          // the tab over its memory ceiling.
          c.width=c.height=0;
          resolve(blob&&blob.size<file.size?blob:file);
        },isPng?'image/png':'image/jpeg',0.85);
      }catch(e){URL.revokeObjectURL(url);resolve(file);}
    };
    im.onerror=function(){URL.revokeObjectURL(url);resolve(file);};
    im.src=url;
  });
}

// ── Embedded image extraction ─────────────────────────────────────────────────
// A workbook can carry photos in two completely different ways, and a round-trip
// through this app involves both:
//
//  1. "Image in cell" (rich values). Excel stores these outside the cell, which
//     reads back as #VALUE!, so SheetJS cannot see the bytes. They are reachable
//     only by walking: cell vm= -> metadata.xml valueMetadata -> futureMetadata
//     rvb -> richData/rdrichvalue.xml -> richValueRel.xml -> rels -> xl/media/*.
//  2. Pictures anchored to a cell (xl/drawings/drawingN.xml). This is what
//     Insert > Picture produces, and — critically — it is also what THIS app
//     writes on export. Reading only (1) meant an exported plan re-uploaded
//     unchanged came back with no images at all, because the file it had just
//     written contained no rich values whatsoever.
//
// Both sources are read and merged. Returns Map(rowNumber -> {p, b}), each of
// which is {file, ext, mime} or null:
//   p = primary photo   (the "Image Ref" column, Q in the template)
//   b = bump-out photo  (the "Bump-out Photo" column, S in the template)
// Images are routed by the column they sit in, so a row carrying both keeps both.
// One in any other column still falls back to the primary slot (left-most wins),
// which is what happens with sheets pre-dating the two-column layout.
// `cols` is {img:'Q', bump:'S'} — resolved from the header row, never hard-coded.

const IMG_EXT_MIME={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp'};

// 0-based column index (the form drawing anchors use) -> column letter.
function colIdxToLetter(n){
  n=Number(n);
  if(!isFinite(n)||n<0)return '';
  let s='';n++;
  while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26);}
  return s;
}

// Resolve a relationship Target ("../media/x.png", "/xl/media/x.png", "media/x.png")
// to a real path inside the zip, relative to the part that owns the .rels file.
function zipResolve(basePart,target){
  let rest=String(target||'').replace(/^\//,'').replace(/^\.\//,'');
  if(/^xl\//.test(rest))return rest;
  const parts=basePart.replace(/\/[^/]*$/,'').split('/');
  while(/^\.\.\//.test(rest)){rest=rest.slice(3);parts.pop();}
  return parts.concat(rest).join('/');
}

// Source 1: in-cell rich-value images.
// Content signature for an image inside the workbook, taken from the zip's own central
// directory — no decompression, so it stays free across 1000 images. Comparing this to
// the signature the last export recorded is what distinguishes "the same photo coming
// back round" from "the user replaced this photo", which is the difference between
// re-uploading everything on every update and never picking up an update at all.
// CRC32 over raw bytes, matching the checksum a zip stores for each entry. Used at
// export time to record what photo a row is carrying, so the next upload can compare
// it against the same checksum read straight out of the uploaded workbook.
let _crcTable=null;
function crc32Bytes(bytes){
  if(!_crcTable){
    _crcTable=new Int32Array(256);
    for(let n=0;n<256;n++){
      let c=n;
      for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);
      _crcTable[n]=c;
    }
  }
  let crc=-1;
  for(let i=0;i<bytes.length;i++)crc=(crc>>>8)^_crcTable[(crc^bytes[i])&0xFF];
  return (crc^-1)>>>0;
}

function imgSigOf(f){
  const d=(f&&f._data)||null;
  if(!d||d.crc32===undefined||d.uncompressedSize===undefined)return '';
  return (d.crc32>>>0)+':'+d.uncompressedSize;
}

// Parse a .rels file into {Id: Target}, one entry per <Relationship> tag,
// reading each attribute independently rather than assuming Id comes before
// Target. This app's own export always writes Id first, but a file that has
// been through Excel or another tool (openpyxl, LibreOffice, …) commonly
// writes Target before Id — an order-dependent regex silently found nothing
// for those files, which meant any picture a user added or edited outside
// this app's own round-trip was never picked up on re-upload.
function relTargetsById(relsXml){
  const out={};
  const tagRe=/<Relationship\b[^>]*\/?>/g;let t;
  while((t=tagRe.exec(relsXml||''))!==null){
    const idM=/\bId="([^"]+)"/.exec(t[0]);
    const tgtM=/\bTarget="([^"]+)"/.exec(t[0]);
    if(idM&&tgtM)out[idM[1]]=tgtM[1];
  }
  return out;
}

async function collectRichValueImages(zip,txt,sheetPath,found){
  const rvXml=await txt('xl/richData/rdrichvalue.xml');
  const rvrXml=await txt('xl/richData/richValueRel.xml');
  const relsXml=await txt('xl/richData/_rels/richValueRel.xml.rels');
  const mdXml=await txt('xl/metadata.xml');
  if(!rvXml||!rvrXml||!relsXml||!mdXml)return;
  const sheetXml=await txt(sheetPath);
  if(!sheetXml)return;

  const cellRe=/<c r="([A-Z]+)(\d+)"[^>]*\bvm="(\d+)"/g;
  const cells=[];let m;
  while((m=cellRe.exec(sheetXml))!==null)cells.push({col:m[1],row:parseInt(m[2],10),vm:parseInt(m[3],10)});
  if(!cells.length)return;

  const vmBlock=/<valueMetadata[\s\S]*?<\/valueMetadata>/.exec(mdXml);
  const rc=vmBlock?(vmBlock[0].match(/<rc[^>]*\bv="(\d+)"/g)||[]).map(s=>parseInt(/v="(\d+)"/.exec(s)[1],10)):[];
  const fmBlock=/<futureMetadata[^>]*name="XLRICHVALUE"[\s\S]*?<\/futureMetadata>/.exec(mdXml);
  const rvb=fmBlock?(fmBlock[0].match(/<xlrd:rvb[^>]*\bi="(\d+)"/g)||[]).map(s=>parseInt(/i="(\d+)"/.exec(s)[1],10)):[];
  const rvs=(rvXml.match(/<rv[^>]*>[\s\S]*?<\/rv>/g)||[]).map(b=>{const v=/<v>(\d+)<\/v>/.exec(b);return v?parseInt(v[1],10):-1;});
  const relIds=(rvrXml.match(/<rel[^>]*r:id="[^"]+"/g)||[]).map(s=>/r:id="([^"]+)"/.exec(s)[1]);
  const target=relTargetsById(relsXml);

  for(const c of cells){
    const iRc=rc[c.vm-1];        if(iRc===undefined)continue;
    const iRvb=rvb[iRc];         if(iRvb===undefined)continue;
    const iRel=rvs[iRvb];        if(iRel===undefined||iRel<0)continue;
    const rid=relIds[iRel];      if(!rid)continue;
    const tgt=target[rid];       if(!tgt)continue;
    const path=zipResolve('xl/richData/richValueRel.xml',tgt);
    const f=zip.file(path);      if(!f)continue;
    const ext=(/\.([a-z0-9]+)$/i.exec(path)||[,'png'])[1].toLowerCase();
    found.push({col:c.col,row:c.row,file:f,ext:ext,sig:imgSigOf(f),mime:IMG_EXT_MIME[ext]||'image/png'});
  }
}

// Source 2: pictures anchored to a cell via the sheet's drawing part.
async function collectDrawingImages(zip,txt,sheetPath,found){
  const sheetRels=await txt(sheetPath.replace(/([^/]+)$/,'_rels/$1.rels'));
  if(!sheetRels)return;
  const drawRe=/<Relationship[^>]*>/g;let rm;
  const drawings=[];
  while((rm=drawRe.exec(sheetRels))!==null){
    if(!/Type="[^"]*\/drawing"/.test(rm[0]))continue;
    const t=/Target="([^"]+)"/.exec(rm[0]);
    if(t)drawings.push(zipResolve(sheetPath,t[1]));
  }
  for(const drawPath of drawings){
    const drawXml=await txt(drawPath);
    if(!drawXml)continue;
    const dRels=await txt(drawPath.replace(/([^/]+)$/,'_rels/$1.rels'));
    // Relationship ids are arbitrary strings, not necessarily rId+digits — this app's
    // own export writes "rIdImg1", so anchoring on \d+ here found nothing at all.
    const dTargets=relTargetsById(dRels||'');
    const media={};
    for(const rid in dTargets)media[rid]=zipResolve(drawPath,dTargets[rid]);
    // oneCellAnchor and twoCellAnchor both carry <from><col>/<row>; absoluteAnchor
    // has no cell reference at all, so it is skipped.
    ['oneCellAnchor','twoCellAnchor'].forEach(function(tag){
      const re=new RegExp('<(?:\\w+:)?'+tag+'\\b[\\s\\S]*?<\\/(?:\\w+:)?'+tag+'>','g');
      let am;
      while((am=re.exec(drawXml))!==null){
        const blk=am[0];
        const from=/<(?:\w+:)?from>([\s\S]*?)<\/(?:\w+:)?from>/.exec(blk);
        const embed=/r:embed="([^"]+)"/.exec(blk);
        if(!from||!embed)continue;
        const cIdx=/<(?:\w+:)?col>(\d+)<\/(?:\w+:)?col>/.exec(from[1]);
        const rIdx=/<(?:\w+:)?row>(\d+)<\/(?:\w+:)?row>/.exec(from[1]);
        if(!cIdx||!rIdx)continue;
        const path=media[embed[1]];
        const f=path&&zip.file(path);
        if(!f)continue;
        const ext=(/\.([a-z0-9]+)$/i.exec(path)||[,'png'])[1].toLowerCase();
        // Anchor indices are 0-based; sheet rows are 1-based.
        found.push({col:colIdxToLetter(parseInt(cIdx[1],10)),row:parseInt(rIdx[1],10)+1,
                    file:f,ext:ext,sig:imgSigOf(f),mime:IMG_EXT_MIME[ext]||'image/png'});
      }
    });
  }
}

async function extractCellImages(data,cols){
  const out=new Map();
  if(typeof JSZip==='undefined')return out;
  let zip;
  try{ zip=await JSZip.loadAsync(data); }catch(e){ return out; }
  const txt=async(p)=>{const f=zip.file(p);return f?await f.async('string'):'';};

  // Resolve the first worksheet part rather than assuming sheet1.xml
  let sheetPath='xl/worksheets/sheet1.xml';
  try{
    const wbXml=await txt('xl/workbook.xml');
    const wbRels=await txt('xl/_rels/workbook.xml.rels');
    const first=/<sheet[^>]*r:id="([^"]+)"/.exec(wbXml);
    if(first&&wbRels){
      const m=new RegExp('Id="'+first[1]+'"[^>]*Target="([^"]+)"').exec(wbRels);
      if(m){const p=zipResolve('xl/workbook.xml',m[1]);if(zip.file(p))sheetPath=p;}
    }
  }catch(e){}

  const found=[];
  try{ await collectRichValueImages(zip,txt,sheetPath,found); }
  catch(e){ console.warn('In-cell image extraction failed:',(e&&e.message)||e); }
  try{ await collectDrawingImages(zip,txt,sheetPath,found); }
  catch(e){ console.warn('Anchored image extraction failed:',(e&&e.message)||e); }
  if(!found.length)return out;

  const imgCol=(cols&&cols.img)||null;
  const bumpCol=(cols&&cols.bump)||null;
  const chosen={};
  for(const info of found){
    if(!info.row)continue;
    if(!chosen[info.row])chosen[info.row]={p:null,b:null};
    const slot=chosen[info.row];
    if(bumpCol&&info.col===bumpCol){ if(!slot.b)slot.b=info; continue; }
    if(imgCol&&info.col===imgCol){ if(!slot.p||slot.p.col!==imgCol)slot.p=info; continue; }
    // Some other column: treat as the primary photo, left-most wins, but never
    // displace one that genuinely came from the Image Ref column.
    if(!slot.p||(slot.p.col!==imgCol&&info.col<slot.p.col))slot.p=info;
  }
  const strip=v=>v?{file:v.file,ext:v.ext,sig:v.sig||'',mime:v.mime}:null;
  for(const row in chosen){
    const v=chosen[row];
    if(v.p||v.b)out.set(parseInt(row,10),{p:strip(v.p),b:strip(v.b)});
  }
  return out;
}

// ── Bulk image upload engine ──────────────────────────────────────────────────
// Handles imports carrying hundreds to 1000+ embedded photos. Design goals:
//  - Concurrency-limited (a handful in flight at once) instead of one at a time,
//    so a 1000-image batch takes minutes instead of tens of minutes.
//  - Per-image retry with backoff, since a single flaky request over a long
//    batch shouldn't permanently cost a photo when a retry would likely succeed.
//  - Checkpoints progress into the plan (local + cloud) every so often, so a
//    closed tab or dropped connection loses at most a few images, not the batch.
//  - Uploads a slot only when the sheet's photo actually differs from the one
//    already recorded for it (compared by content signature), so re-running an
//    interrupted import fills only the gaps, an unchanged workbook costs nothing,
//    and a photo the user genuinely replaced in Excel does take effect.
//  - Cancellable mid-batch via a shared flag, surfaced through a persistent
//    progress banner rather than a flood of toasts.
const BULK_UPLOAD_CONCURRENCY=4;      // simultaneous uploads
const BULK_UPLOAD_RETRIES=2;          // extra attempts after the first, per image
const BULK_UPLOAD_CHECKPOINT_EVERY=20; // cloud checkpoint cadence (successes+failures)

function sleep(ms){return new Promise(function(res){setTimeout(res,ms);});}

// Runs worker(item) over items with at most `limit` running concurrently.
// Waits for every item to settle (the worker itself must not throw).
async function runWithConcurrency(items,limit,worker){
  let idx=0;
  async function lane(){
    while(idx<items.length){
      const my=idx++;
      await worker(items[my],my);
    }
  }
  const lanes=[];
  const n=Math.max(1,Math.min(limit,items.length));
  for(let i=0;i<n;i++)lanes.push(lane());
  await Promise.all(lanes);
}

// Shared upload-with-retry used by both the single asset-photo uploader and the
// bulk importer, so both benefit from the same resilience to transient errors.
async function storageUploadWithRetry(path,body,contentType,retries){
  const tries=(retries==null?BULK_UPLOAD_RETRIES:retries);
  let lastErr=null;
  for(let attempt=0;attempt<=tries;attempt++){
    try{
      const { error }=await sb.storage.from(STORAGE_BUCKET).upload(path,body,{
        cacheControl:'3600',upsert:false,contentType:contentType
      });
      if(error)throw error;
      return {ok:true};
    }catch(err){
      lastErr=err;
      if(attempt<tries)await sleep(400*Math.pow(2,attempt)); // 400ms, 800ms, ...
    }
  }
  return {ok:false,error:lastErr};
}

async function attachImportedImages(plan,imgMap,opts){
  const options=opts||{};
  const onProgress=options.onProgress||function(){};
  const isCancelled=options.isCancelled||function(){return false;};

  if(!imgMap||!imgMap.size||!sb)return {ok:0,failed:0,skipped:0,cancelled:false};

  const jobs=[];
  let skipped=0;
  for(const a of (plan.assets||[])){
    const found=a._srcRow?imgMap.get(a._srcRow):null;
    if(!found)continue;
    // Change detection. Our own export embeds each photo AND records that photo's
    // signature in a hidden column, so a workbook coming back untouched presents the
    // very same bytes we put in it. Comparing the two is what makes an update actually
    // update: previously any slot that already had a photo was skipped outright, so a
    // photo the user replaced in Excel could never take effect. Rules per slot:
    //   - nothing stored yet            -> upload (first migration)
    //   - sheet image matches recorded  -> leave it alone, nothing changed
    //   - anything else                 -> the user changed it, upload and replace
    const unchanged=(info,sig)=>!!(info&&info.sig&&sig&&info.sig===sig);
    if(found.p){
      if(a.imageUrl&&unchanged(found.p,a._sheetSig1))skipped++;
      else jobs.push({asset:a,info:found.p,slot:1,replacing:a.imagePath||''});
    }
    if(found.b){
      if(a.image2Url&&unchanged(found.b,a._sheetSig2))skipped++;
      else jobs.push({asset:a,info:found.b,slot:2,replacing:a.image2Path||''});
    }
  }
  if(!jobs.length)return {ok:0,failed:0,skipped:skipped,cancelled:false,cleanupFailed:0};

  let ok=0,failed=0,done=0,cancelled=false,cleanupFailed=0;
  let sinceCheckpoint=0,checkpointInFlight=false,localFull=false;

  async function checkpoint(){
    if(checkpointInFlight)return; // don't stack overlapping cloud writes
    checkpointInFlight=true;
    // A 500–1000 asset plan serialises to well past the ~5MB localStorage quota, so
    // storageSave() just fails. Left alone that is a full JSON.stringify of the whole
    // plan thrown away on every checkpoint, dozens of times over a long migration.
    // Try once; if it does not fit, stop trying and rely on IndexedDB, which has no
    // practical size limit here and is what actually makes the batch resumable.
    if(!localFull&&!storageSave(plan))localFull=true;
    try{ await planDB.save(plan); }catch(e){ /* best-effort; next checkpoint retries */ }
    checkpointInFlight=false;
  }

  await runWithConcurrency(jobs,BULK_UPLOAD_CONCURRENCY,async function(job){
    if(isCancelled()){cancelled=true;return;}
    let lastErr=null;
    for(let attempt=0;attempt<=BULK_UPLOAD_RETRIES;attempt++){
      if(isCancelled()){cancelled=true;return;}
      try{
        const buf=await job.info.file.async('blob');
        const raw=new Blob([buf],{type:job.info.mime});
        const body=await imgDownscale(raw);
        const F=imgSlotFields(job.slot||1);
        // Slot suffix keeps the two photos of one asset from ever landing on the same
        // storage path (imgPathFor's timestamp alone can collide within a millisecond).
        const name=(job.asset.assetId||'asset')+(job.slot===2?'-bumpout':'')+'.'+job.info.ext;
        const path=imgPathFor(plan.id,job.asset.assetId,name);
        const res=await storageUploadWithRetry(path,body,body.type||job.info.mime,0); // outer loop already retries
        if(!res.ok)throw res.error;
        const { data }=sb.storage.from(STORAGE_BUCKET).getPublicUrl(path);
        job.asset[F.path]=path;
        job.asset[F.url]=(data&&data.publicUrl)||'';
        // Keep the caption in step with the photo actually attached. Without this,
        // a slot's reference text is whatever was typed into that Excel column at
        // some point in the past (often nothing meaningful, e.g. a stray migration
        // artifact) and never updates again, so a brand-new photo would still show
        // old, unrelated caption text underneath it.
        job.asset[F.ref]=name;
        // This upload replaced an earlier photo — drop the old object so a plan that is
        // updated repeatedly does not accumulate orphans in the bucket. Best effort:
        // the new photo is already safely attached, so a failure here is not fatal to
        // the import — but a failure here is exactly what produces duplicate objects
        // in the bucket over repeated updates, most likely because the bucket's RLS
        // policies don't grant DELETE on this path (see uploadAssetImage for the
        // same note). Counted rather than swallowed so the batch summary reports it.
        if(job.replacing&&job.replacing!==path){
          try{ await sb.storage.from(STORAGE_BUCKET).remove([job.replacing]); }
          catch(e){ cleanupFailed++; console.warn('Old image cleanup failed (RLS delete policy on the bucket?):',(e&&e.message)||e,job.replacing); }
        }
        ok++;lastErr=null;        break;
      }catch(err){
        lastErr=err;
        if(attempt<BULK_UPLOAD_RETRIES)await sleep(400*Math.pow(2,attempt));
      }
    }
    if(lastErr){
      failed++;
      console.warn('Image upload failed for asset '+job.asset.assetId+':',(lastErr&&lastErr.message)||lastErr);
    }
    // Drop this image's zip entry now that it is uploaded (or has failed for good).
    // JSZip caches an entry's decompressed bytes on first read, so on a 500–1000
    // photo migration holding all of them would keep the entire workbook's images
    // resident at once. Releasing per job keeps the ceiling at the few in flight.
    job.info.file=null;
    done++;sinceCheckpoint++;
    onProgress({done:done,total:jobs.length,ok:ok,failed:failed,skipped:skipped});
    if(sinceCheckpoint>=BULK_UPLOAD_CHECKPOINT_EVERY){
      sinceCheckpoint=0;
      await checkpoint();
    }
  });

  await checkpoint(); // final checkpoint so the tail of the batch is never left unsaved

  return {ok:ok,failed:failed,skipped:skipped,cancelled:cancelled,cleanupFailed:cleanupFailed};
}

// ── Bulk image progress banner ────────────────────────────────────────────────
// A persistent banner (not the auto-hiding toast) for batches that can run for
// minutes across hundreds of images, with a Cancel button. Checkpointing above
// means cancelling — or the tab closing unexpectedly — only loses work back to
// the last checkpoint, not the whole batch.
let _bulkImgCancelFlag=false;
let _bulkImgLastRender=0;
function bulkImgBannerShow(){
  if(document.getElementById('bulk-img-banner'))return;
  const el=document.createElement('div');
  el.id='bulk-img-banner';
  el.style.cssText='position:fixed;top:0;left:0;right:0;z-index:998;background:#003A5D;color:#fff;padding:10px 16px;font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:14px;box-shadow:0 2px 8px rgba(0,0,0,.25)';
  el.innerHTML='<span id="bulk-img-banner-text">Attaching photos\u2026</span>'
    +'<button id="bulk-img-banner-cancel" onclick="cancelBulkImageUpload()" style="font-size:11px;padding:4px 12px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:6px;cursor:pointer">Cancel</button>';
  document.body.appendChild(el);
}
function bulkImgBannerUpdate(text){
  const t=document.getElementById('bulk-img-banner-text');
  if(t)t.textContent=text;
}
function bulkImgBannerHide(){
  const el=document.getElementById('bulk-img-banner');
  if(el)el.remove();
}
function cancelBulkImageUpload(){
  _bulkImgCancelFlag=true;
  bulkImgBannerUpdate('Cancelling\u2026 finishing photos already in flight');
  const btn=document.getElementById('bulk-img-banner-cancel');
  if(btn){btn.disabled=true;btn.textContent='Cancelling\u2026';}
}

// Maps a photo "slot" (1 = original reference image, 2 = bump-out photo) to its
// three data fields on the asset. Slot 1 keeps the original field names/DOM ids
// so existing plans and existing uploaded images keep working unchanged.
function imgSlotFields(slot){
  return slot===2
    ? {url:'image2Url',path:'image2Path',ref:'image2Ref',tag:'2'}
    : {url:'imageUrl', path:'imagePath', ref:'imageRef', tag:''};
}

async function uploadAssetImage(input,aid,slot){
  const F=imgSlotFields(slot||1);
  const file=input.files&&input.files[0];
  input.value='';
  if(!file)return;
  const a=S.plan.assets.find(x=>x.id===aid);if(!a)return;

  if(!/^image\//.test(file.type)){showToast('That file is not an image');return;}
  if(file.size>IMAGE_MAX_BYTES){showToast('Image is too large (max 10MB)');return;}
  if(!sb){showToast('Image upload needs a cloud connection');return;}

  const stat=document.getElementById('img-stat'+F.tag+'-'+aid);
  if(stat)stat.textContent='Uploading\u2026';
  try{
    const body=await imgDownscale(file);
    const path=imgPathFor(S.plan.id,a.assetId,file.name);
    const res=await storageUploadWithRetry(path,body,body.type||file.type,1); // 1 retry for a single manual upload
    if(!res.ok)throw res.error;
    const { data }=sb.storage.from(STORAGE_BUCKET).getPublicUrl(path);

    // Replacing an existing image? Clean up the old object so the bucket doesn't
    // accumulate orphans. Failure here is non-fatal — the new image is already up —
    // but it must not be SILENT: a storage-side RLS policy that blocks DELETE (the
    // built-in Supabase Storage template policies restrict by extension/"private/"
    // prefix, which does not match this bucket's "plans/..." paths) fails every
    // single remove() call forever, so the bucket quietly accumulates a duplicate
    // object per replace. Surfacing it here is what makes that visible instead of
    // only showing up as a slowly growing Storage bill.
    const oldPath=a[F.path];
    a[F.path]=path;
    a[F.url]=(data&&data.publicUrl)||'';
    // Always refresh the caption to the file just uploaded — previously this only
    // filled in a blank reference, so an old/unrelated caption (e.g. leftover
    // migration text) would sit under a brand-new photo forever, never updating on
    // Replace.
    a[F.ref]=file.name;
    let cleanupFailed=false;
    if(oldPath&&oldPath!==path){
      try{ await sb.storage.from(STORAGE_BUCKET).remove([oldPath]); }
      catch(e){ cleanupFailed=true; console.warn('Old image cleanup failed (RLS delete policy on the bucket?):',e.message,oldPath); }
    }
    S._unsaved=true;
    refreshAssets();
    // Sync to Supabase immediately so the image renders for anyone loading this
    // plan from the cloud, not just in this browser's local cache.
    planDB.save(S.plan).then(function(saveRes){
      const i=S.plans.findIndex(p=>p.id===S.plan.id);
      if(i>=0)S.plans[i]=JSON.parse(JSON.stringify(S.plan));
      S._unsaved=!(saveRes&&saveRes.ok&&saveRes.source==='cloud');
      refreshAssets();
      const base=(saveRes&&saveRes.source==='cloud')
        ? 'Image uploaded and saved to cloud'
        : 'Image uploaded \u2014 remember to save the plan';
      showToast(cleanupFailed?(base+' \u2014 old copy left in storage, check bucket permissions'):base);
    });
  }catch(err){
    if(stat)stat.textContent='';
    const msg=String((err&&err.message)||err);
    console.warn('Image upload failed:',msg);
    if(/bucket/i.test(msg)&&/not found|does not exist/i.test(msg)){
      showToast('Storage bucket "'+STORAGE_BUCKET+'" not found');
    }else if(/row-level security|policy|unauthorized|403/i.test(msg)){
      showToast('Upload blocked by bucket permissions');
    }else{
      showToast('Upload failed: '+msg.slice(0,60));
    }
  }
}

async function removeAssetImage(aid,slot){
  const F=imgSlotFields(slot||1);
  const a=S.plan.assets.find(x=>x.id===aid);if(!a)return;
  if(!confirm('Remove this image? This deletes it from storage and cannot be undone.'))return;
  const path=a[F.path];
  a[F.url]='';a[F.path]='';a[F.ref]='';
  S._unsaved=true;
  refreshAssets();
  if(path&&sb){
    try{ await sb.storage.from(STORAGE_BUCKET).remove([path]); }
    catch(e){ console.warn('Image delete failed:',e.message); }
  }
  // Sync the removal to Supabase immediately too, for the same reason as upload above —
  // otherwise a stale imageUrl can linger in the cloud record after the file is gone.
  planDB.save(S.plan).then(function(saveRes){
    const i=S.plans.findIndex(p=>p.id===S.plan.id);
    if(i>=0)S.plans[i]=JSON.parse(JSON.stringify(S.plan));
    S._unsaved=!(saveRes&&saveRes.ok&&saveRes.source==='cloud');
    refreshAssets();
    showToast((saveRes&&saveRes.source==='cloud')
      ? 'Image removed and saved to cloud'
      : 'Image removed \u2014 remember to save the plan');
  });
}

    +'</div>';
  }),'Assets');

  const lastEditedHtml=plan.lastEditedBy?'<div style="margin-top:10px;padding-top:10px;border-top:1px solid #e8e5de"><div style="display:flex;justify-content:space-between;align-items:baseline"><div style="font-size:12px;color:#888">Last edited by</div><div style="font-size:11px;color:#aaa">'+(plan.lastEditedAt?fmtDate(plan.lastEditedAt):'')+'</div></div><div style="font-size:13px;font-weight:600;color:#0091D2;margin-top:2px">'+esc(plan.lastEditedBy)+'</div></div>':'';
  const storageHtml=p.storageDetails?'<div style="margin-top:10px"><div style="font-size:12px;color:#888">Storage</div><div style="font-size:13px;margin-top:2px;color:#1a1a1a">'+esc(p.storageDetails)+'</div></div>':'';

  const saveBtnHtml=S.plan._example?'':'<button onclick="savePlan()" style="background:linear-gradient(135deg,#0091D2,#0072A8);color:#fff;border-color:#0072A8;font-weight:700;padding:9px 20px;box-shadow:0 2px 8px rgba(0,145,210,.3)">Save plan &#10003;</button>';
  const unsavedBadge=S._unsaved&&!S.plan._example?'<span id="unsaved-badge" style="font-size:11px;font-weight:700;color:#854F0B;background:#FAEEDA;border:1px solid #f5ddb7;border-radius:6px;padding:3px 9px;white-space:nowrap">&#9679; Unsaved changes</span>':'';

  let h='';
  h+='<div class="card">';

  h+='<div class="g2" style="margin-top:10px"><div><div style="font-size:12px;color:#888">Role</div><div style="font-size:14px;margin-top:2px">'+(esc(p.role)||'-')+'</div></div><div><div style="font-size:12px;color:#888">Date</div><div style="font-size:14px;margin-top:2px">'+fmtAUDate(p.date)+'</div></div></div>';
  const sumCode=planCode(S.plan.id);
  h+='<div class="plan-id-badge">'
    +'<div><div class="plan-id-lbl">Plan ID</div><div class="plan-id-code">'+sumCode+'</div></div>'
    +'<button class="plan-id-copy-btn" data-code="'+sumCode+'" onclick="copyCode(this)">Copy</button>'

  h+=lastEditedHtml+storageHtml;

  h+='<div class="card">';

  h+='<div class="metg"><div class="met"><div class="mval">'+allMats.length+'</div><div class="mlbl">Total materials</div></div><div class="met"><div class="mval" style="color:'+cl+'">'+divertedCount+'</div><div class="mlbl">Diverted from landfill</div></div><div class="met"><div class="mval" style="color:#A32D2D">'+wasteCount+'</div><div class="mlbl">Waste</div></div></div>';
  h+=circBody;
  h+='</div>';
  const actualCts={};for(const m of allMats)if(m.outcome&&m.outcome!=='')actualCts[m.outcome]=(actualCts[m.outcome]||0)+1;
  const actualRows=Object.entries(actualCts).sort((a,b)=>b[1]-a[1]).map(([s,n])=>'<div class="srow"><div class="sdot" style="background:'+(STCOL[s]||'#9ca3af')+'"></div><div style="flex:1;color:#1a1a1a">'+esc(s)+'</div><div style="font-weight:600;min-width:20px;text-align:right">'+n+'</div></div>').join('');
  if(allMats.length&&stRows)h+='<div class="card"><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><div><div class="sechd" style="margin-top:0">Materials by expected status</div>'+stRows+'</div><div><div class="sechd" style="margin-top:0;color:#0091D2">Materials ACTUALS POST EVENT</div>'+(actualRows||'<div style="font-size:13px;color:#aaa;margin-top:6px">Complete field 8 at bump-out to track actuals.</div>')+'</div></div></div>';
  h+='<div class="card"><div class="sechd" style="margin-top:0">AO Target Materials coverage</div><div class="g2"><div class="met"><div class="mval" style="color:#0091D2">'+tmlMats.length+'</div><div class="mlbl">From AO Target List</div></div><div class="met"><div class="mval" style="color:#888">'+customMats.length+'</div><div class="mlbl">Custom / unlisted</div></div></div></div>';
  h+=flaggedBlock;
  if(assets.length)h+='<div class="card"><div class="sechd" style="margin-top:0">Asset &amp; material detail</div>'+assetRows+'</div>';
  h+='<div style="background:#EEF9F4;border:1px solid #b2e8d2;border-radius:8px;padding:11px 14px;font-size:13px;color:#0F6E56;margin-top:1.5rem;line-height:1.65">';
  h+='Save your Plan ID — you\'ll need it to reload and update materials outcomes on the <strong>Materials management plan</strong>.';

    '<div style="margin-top:1rem;padding:10px 14px;background:#CFE7E9;border:1px solid #e0ddd6;border-radius:8px;font-size:11.5px;color:#777;line-height:1.65">'
    +'By clicking <strong style="color:#1a1a1a">Save plan</strong>, you consent to Tennis Australia collecting your name and email to save your materials plan. '

    +'<a onclick="switchTab(\'faq\');setTimeout(()=>{const el=document.getElementById(\'faq-privacy\');if(el){el.classList.add(\'open\');const ic=document.getElementById(\'icon-faq-privacy\');if(ic)ic.classList.add(\'open\');}},100);return false;" href="#" style="color:#0091D2;font-weight:600;text-decoration:underline">View our full Privacy Policy</a> to learn more.'
    +'</div>';
  h+=consentHtml;
