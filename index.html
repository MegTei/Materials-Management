function matRowHtml(aid,m,idx){
  const tmlInfo=renderTMLInfo(m.tmlRef);
  const vunitVal=m.vunit||'';
  const vunitCustom=vunitVal&&!VOLS.includes(vunitVal);
  const vOpts=(vunitCustom?`<option value="${esc(vunitVal)}" selected>${esc(vunitVal)}</option>`:'')+VOLS.map(v=>`<option${m.vunit===v?' selected':''}>${v}</option>`).join('');
  // Field 7 "Other material" shown when no TML selected or OTHER selected
  const showF7=(!m.tmlRef||m.tmlRef==='OTHER');
  const matLabel=m.name||(m.cat?m.cat.split('(')[0].trim():'')||'Material '+(idx+1);
  // Precinct application: preserve an imported value that isn't in the option list
  const appList=(S.plan.roleType==='TA'?PREC_APPS_TA:PREC_APPS);
  const appVal=m.app||'';
  const appCustom=appVal&&!appList.some(o=>o.toLowerCase()===appVal.toLowerCase());
  const appOpts=`<option value="">Select application...</option>`+(appCustom?`<option value="${esc(appVal)}" selected>${esc(appVal)}</option>`:'')+mkOpts(appList,m.app);
  return`<div class="mat-row" id="mr-${m.id}">
    <div class="mat-row-hd">
      <span class="mat-row-num">Material ${idx+1}</span>
      <span class="mat-row-name">${esc(matLabel)}</span>
      <button onclick="delAssetMat('${aid}','${m.id}')" style="background:none;border:none;cursor:pointer;color:#ccc;padding:1px 5px;font-size:14px;flex-shrink:0" title="Remove material">&times;</button>
    </div>
    ${idx===0?`<div class="fg">
      <label>4. Precinct application *</label>
      <select data-aid="${aid}" data-mid="${m.id}" data-f="app" onchange="upAssetMat(this)">
        ${appOpts}
      </select>
    </div>`:''}
    <div class="fg">
      <label>5. Material details *<span class="name-sub-label">Select from AO Target Materials List (<a href="https://megtei.github.io/Materials_Methods_Plan/" target="_blank" style="color:#0091D2;font-weight:700">view full list &#8599;</a>) or tell us at 5a</span></label>
      <select data-aid="${aid}" data-mid="${m.id}" data-f="tmlRef" onchange="pickAssetMatTML(this)">
        <option value="">- Select from AO Target Materials List -</option>
        <option value="OTHER"${m.tmlRef==='OTHER'?' selected':''}>Not AO target material \u2013 go to 5a</option>
        <option value="" disabled style="color:#ccc">\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500</option>
        ${renderTMLOptions(m.tmlRef)}
      </select>
      ${tmlInfo}
    </div>
    <div class="fg" id="f7-${m.id}"${showF7?'':' style="display:none"'}>
      <label>5a. If not on the AO target materials list, provide material name here *</label>
      <input type="text" data-aid="${aid}" data-mid="${m.id}" data-f="name" value="${esc(m.name)}" placeholder="Enter material name\u2026" onblur="upAssetMat(this)">
    </div>
    <div style="display:flex;gap:8px;align-items:flex-end">
      <div class="fg" style="flex:1;margin-bottom:0"><label>Volume${S.plan.roleType==='TA'?'':' *'}</label><input type="text" data-aid="${aid}" data-mid="${m.id}" data-f="vol" value="${esc(m.vol)}" placeholder="e.g. 50" onblur="upAssetMat(this)"></div>
      <div class="fg" style="width:90px;margin-bottom:0"><label>Unit${S.plan.roleType==='TA'?'':' *'}</label><select data-aid="${aid}" data-mid="${m.id}" data-f="vunit" onchange="upAssetMat(this)">${vOpts}</select></div>
    </div>
    <div class="fg" style="margin-top:8px">
      <label>6. Expected material status at end of event *</label>
      <select data-aid="${aid}" data-mid="${m.id}" data-f="stat" onchange="upAssetMat(this)">${mkOpts(STATS,m.stat,'Select status...')}</select>
    </div>
    <div class="fg">
      <label style="color:#aaa">7. Actual outcome <span style="font-size:10px;font-weight:400">(complete post-event)</span></label>
      <select data-aid="${aid}" data-mid="${m.id}" data-f="outcome" onchange="upAssetMat(this);toggleOutcomeOther(this,'${aid}','${m.id}')">${mkOpts(STATS,m.outcome,'Select actual outcome...')}</select>
      ${m.outcome==='Other'?`<input type="text" data-aid="${aid}" data-mid="${m.id}" data-f="outcomeOther" value="${esc(m.outcomeOther||'')}" placeholder="Please specify..." onblur="upAssetMat(this)" style="margin-top:6px">`:'<span id="outcome-other-'+aid+'-'+m.id+'" style="display:none"><input type="text" data-aid="'+aid+'" data-mid="'+m.id+'" data-f="outcomeOther" value="'+esc(m.outcomeOther||'')+'" placeholder="Please specify..." onblur="upAssetMat(this)" style="margin-top:6px"></span>'}
    </div>
  </div>`;
}

// ── Step 2: Summary ───────────────────────────────────────────────────────────
function stepSummary(plan){
  const p=plan.profile;const assets=plan.assets||[];const sc=calcScore(assets);const cl=fillClr(sc.pct);
  const allMats=assets.flatMap(a=>a.materials||[]);
  // Waste = ONLY materials whose expected status is "Mixed construction waste".
  // "Unsure yet"/no status is no-data, NOT waste, so it is excluded from this count.
  const wasteCount=allMats.filter(m=>m.stat&&String(m.stat).toLowerCase().includes('mixed construction waste')).length;
  const stCts={};for(const m of allMats)if(m.stat)stCts[m.stat]=(stCts[m.stat]||0)+1;
  const stRows=Object.entries(stCts).sort((a,b)=>b[1]-a[1]).map(([s,n])=>'<div class="srow"><div class="sdot" style="background:'+(STCOL[s]||'#9ca3af')+'"></div><div style="flex:1;color:#1a1a1a">'+esc(s)+'</div><div style="font-weight:600;min-width:20px;text-align:right">'+n+'</div></div>').join('');
  const tmlMats=allMats.filter(m=>m.tmlRef&&m.tmlRef!=='OTHER');
  const customMats=allMats.filter(m=>!m.tmlRef||m.tmlRef==='OTHER');
  const flaggedAssets=assets.filter(a=>a.materials.some(m=>{if(!m.tmlRef||m.tmlRef==='OTHER')return false;const t=TML.find(x=>x.ref===m.tmlRef);return t&&t.status==='no';}));
  const flaggedBlock=flaggedAssets.length?'<div class="card"><div class="sechd" style="margin-top:0;color:#854F0B">Limit use if possible or seek alternatives ('+flaggedAssets.length+')</div><div style="background:#FAEEDA;border-radius:8px;padding:10px 12px;font-size:13px;color:#854F0B;margin-bottom:12px">Review these assets. Consider switching to AO recommended alternatives where possible. <a href="https://megtei.github.io/Materials_Methods_Plan/" target="_blank" style="color:#854F0B;font-weight:700;text-decoration:underline">View AO Target Materials List &#8599;</a></div>'+flaggedAssets.map(a=>{const flagMats=a.materials.filter(m=>{if(!m.tmlRef||m.tmlRef==='OTHER')return false;const t=TML.find(x=>x.ref===m.tmlRef);return t&&t.status==='no';});return'<div class="srow"><span class="bdg am">'+esc(a.assetName||'Asset')+'</span><span style="flex:1;margin:0 8px;color:#555;font-size:12px">'+flagMats.map(m=>esc(m.name||m.tmlRef)).join(', ')+'</span></div>';}).join('')+'</div>':'';
  const assetRows=foldByApp(assets,assets.map((a,idx2)=>{
    const precLabel=a.prec||'';
    const matList=a.materials.map(m=>{
      const statClr=STCOL[m.stat]||'#94a3b8';
      const statBdgMap={'Reuse - next AO (stored at TA warehouse)':'gr','Reuse - next AO (stored by Agency/Builder)':'gr','Reuse - other event/ client (Agency/Builder)':'tl','Recycle - we will take off site (Agency/Builder)':'bl','Recycle on site with AO Take-back program':'bl','Repurpose - keep for another use':'pu','Reuse - next AO (stored by AO)':'gr','Reuse - next AO (stored by us)':'gr','Reuse - other event/ client':'tl','Recycle on site with AO take-back program':'bl','Recycle - we will take offsite':'bl','Repurpose - we will take offsite for another use':'pu','Donate':'pu','Mixed construction waste - AO onsite bins':'re','Unsure yet':'gy','Reuse \u2013 Next AO (stored at AO)':'gr','Reuse \u2013 Next AO (stored by us)':'gr','Reuse \u2013 Other Event / Client':'tl','Recycle':'bl','Repurpose – use material in another way':'pu','Mixed construction waste \u2013 AO onsite bin':'re','Not sure yet':'gy','Other':'gy'};
      const volHtml=m.vol?'<span style="color:#aaa;font-size:11px">'+esc(m.vol)+' '+esc(m.vunit)+'</span>':'';
      const statHtml=m.stat?'<span class="bdg '+(statBdgMap[m.stat]||'gy')+'">'+esc(m.stat)+'</span>':'';
      return '<div class="smat-item"><span class="smat-dot" style="background:'+statClr+'"></span><span style="flex:1">'+esc(m.name||m.cat||'Unnamed')+'</span>'+volHtml+statHtml+'</div>';
    }).join('');
    const precBdg=precLabel?'<span class="bdg bl" style="font-size:10px">'+esc(precLabel)+'</span>':'';
    const descHtml=a.desc?'<div style="font-size:12px;color:#888;margin-bottom:5px;padding-left:2px">'+esc(a.desc)+'</div>':'';
    return '<div style="padding:10px 0;border-bottom:1px solid #e8e5de"><div style="display:flex;align-items:center;gap:7px;margin-bottom:6px"><span style="font-size:11px;color:#aaa;font-weight:700">#'+(idx2+1)+'</span>'+precBdg+'<span style="font-size:13px;font-weight:600;flex:1">'+esc(a.assetName||'Unnamed asset')+'</span>'+assetCirc(a)+'</div>'+descHtml+'<div class="smat-list">'+matList+'</div></div>';
  }),'Assets');
  const lastEditedHtml=plan.lastEditedBy?'<div style="margin-top:10px;padding-top:10px;border-top:1px solid #e8e5de"><div style="display:flex;justify-content:space-between;align-items:baseline"><div style="font-size:12px;color:#888">Last edited by</div><div style="font-size:11px;color:#aaa">'+(plan.lastEditedAt?fmtDate(plan.lastEditedAt):'')+'</div></div><div style="font-size:13px;font-weight:600;color:#0091D2;margin-top:2px">'+esc(plan.lastEditedBy)+'</div></div>':'';
  const storageHtml=p.storageDetails?'<div style="margin-top:10px"><div style="font-size:12px;color:#888">Storage</div><div style="font-size:13px;margin-top:2px;color:#1a1a1a">'+esc(p.storageDetails)+'</div></div>':'';
  const circBody=sc.total>0?'<div style="display:flex;justify-content:space-between;font-size:12px;color:#888;margin-bottom:4px"><span>Circularity rate</span><span style="font-weight:600;color:'+cl+'">'+sc.pct+'%</span></div><div class="strack"><div class="sfill" style="width:'+sc.pct+'%;background:'+cl+'"></div></div><div style="font-size:11px;color:#aaa;margin-top:3px">AO target: 10% improvement per year</div>':'<div style="font-size:13px;color:#888;margin-top:4px">Add materials with an expected status to see your score.</div>';
  const customHtml=customMats.length?'<div style="font-size:12px;color:#888">Custom: '+customMats.map(m=>'<strong>'+esc(m.name||'Unnamed')+'</strong>').join(', ')+'</div>':'';
  const saveBtnHtml=S.plan._example?'':'<button onclick="savePlan()" style="background:linear-gradient(135deg,#0091D2,#0072A8);color:#fff;border-color:#0072A8;font-weight:700;padding:9px 20px;box-shadow:0 2px 8px rgba(0,145,210,.3)">Save plan &#10003;</button>';
  const unsavedBadge=S._unsaved&&!S.plan._example?'<span id="unsaved-badge" style="font-size:11px;font-weight:700;color:#854F0B;background:#FAEEDA;border:1px solid #f5ddb7;border-radius:6px;padding:3px 9px;white-space:nowrap">&#9679; Unsaved changes</span>':'';

  let h='';
  h+='<div class="card">';
  h+='<div class="sechd" style="margin-top:0">Plan details</div>';
  h+='<div class="g2"><div><div style="font-size:12px;color:#888">Business</div><div style="font-size:14px;font-weight:600;margin-top:2px">'+(esc(p.businessName)||'-')+'</div></div><div><div style="font-size:12px;color:#888">Plan owner</div><div style="font-size:14px;margin-top:2px">'+(esc(p.ownerName)||'-')+'</div></div></div>';
  h+='<div class="g2" style="margin-top:10px"><div><div style="font-size:12px;color:#888">Role</div><div style="font-size:14px;margin-top:2px">'+(esc(p.role)||'-')+'</div></div><div><div style="font-size:12px;color:#888">Date</div><div style="font-size:14px;margin-top:2px">'+fmtAUDate(p.date)+'</div></div></div>';
  const sumCode=planCode(S.plan.id);
  h+='<div class="plan-id-badge">'
    +'<div><div class="plan-id-lbl">Plan ID</div><div class="plan-id-code">'+sumCode+'</div></div>'
    +'<button class="plan-id-copy-btn" data-code="'+sumCode+'" onclick="copyCode(this)">Copy</button>'
    +'</div>';
  h+=lastEditedHtml+storageHtml;
  h+='</div>';
  h+='<div class="card">';
  h+='<div class="sechd" style="margin-top:0">Circularity score</div>';
  h+='<div class="metg"><div class="met"><div class="mval">'+allMats.length+'</div><div class="mlbl">Total materials</div></div><div class="met"><div class="mval" style="color:'+cl+'">'+(sc.total>0?sc.pct+'%':'-')+'</div><div class="mlbl">Diverted from landfill</div></div><div class="met"><div class="mval" style="color:#A32D2D">'+wasteCount+'</div><div class="mlbl">Waste</div></div></div>';
  h+=circBody;
  h+='</div>';
  const actualCts={};for(const m of allMats)if(m.outcome&&m.outcome!=='')actualCts[m.outcome]=(actualCts[m.outcome]||0)+1;
  const actualRows=Object.entries(actualCts).sort((a,b)=>b[1]-a[1]).map(([s,n])=>'<div class="srow"><div class="sdot" style="background:'+(STCOL[s]||'#9ca3af')+'"></div><div style="flex:1;color:#1a1a1a">'+esc(s)+'</div><div style="font-weight:600;min-width:20px;text-align:right">'+n+'</div></div>').join('');
  if(allMats.length&&stRows)h+='<div class="card"><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><div><div class="sechd" style="margin-top:0">Materials by expected status</div>'+stRows+'</div><div><div class="sechd" style="margin-top:0;color:#0091D2">Materials ACTUALS POST EVENT</div>'+(actualRows||'<div style="font-size:13px;color:#aaa;margin-top:6px">Complete field 8 at bump-out to track actuals.</div>')+'</div></div></div>';
  h+='<div class="card"><div class="sechd" style="margin-top:0">AO Target Materials coverage</div><div class="g2"><div class="met"><div class="mval" style="color:#0091D2">'+tmlMats.length+'</div><div class="mlbl">From AO Target List</div></div><div class="met"><div class="mval" style="color:#888">'+customMats.length+'</div><div class="mlbl">Custom / unlisted</div></div></div></div>';
  h+=flaggedBlock;
  if(assets.length)h+='<div class="card"><div class="sechd" style="margin-top:0">Asset &amp; material detail</div>'+assetRows+'</div>';
  h+='<div style="background:#EEF9F4;border:1px solid #b2e8d2;border-radius:8px;padding:11px 14px;font-size:13px;color:#0F6E56;margin-top:1.5rem;line-height:1.65">';
  h+='Save your Plan ID — you\'ll need it to reload and update materials outcomes on the <strong>Materials management plan</strong>.';
  h+='</div>';
  // Consent notice — shown only for real plans (not example), only when a save button is present
  const consentHtml = S.plan._example ? '' :
    '<div style="margin-top:1rem;padding:10px 14px;background:#f8f7f5;border:1px solid #e0ddd6;border-radius:8px;font-size:11.5px;color:#777;line-height:1.65">'
    +'By clicking <strong style="color:#1a1a1a">Save plan</strong>, you consent to Tennis Australia collecting your name and email to save your materials plan. '
    +'Your data is securely routed to and stored on Australian servers and infrastructure. '
    +'We never sell your data or use it for secondary purposes without consent. '
    +'<a onclick="switchTab(\'faq\');setTimeout(()=>{const el=document.getElementById(\'faq-privacy\');if(el){el.classList.add(\'open\');const ic=document.getElementById(\'icon-faq-privacy\');if(ic)ic.classList.add(\'open\');}},100);return false;" href="#" style="color:#0091D2;font-weight:600;text-decoration:underline">View our full Privacy Policy</a> to learn more.'
    +'</div>';
  h+=consentHtml;
  h+='<div class="acts" style="margin-top:.75rem"><button onclick="goPrev()">&larr; Back</button>'+(S.plan._example?'<button onclick="goHome()" style="background:#0091D2;color:#fff;border-color:#0091D2;font-weight:700">&#8962; Home</button>':'<button onclick="window.print()">Print / PDF</button><button onclick="exportPlanXLS()">Export XLS</button>'+unsavedBadge+saveBtnHtml)+'</div>';
  return h;
}

function triggerImport(){const el=document.getElementById('import-xls-input');if(el)el.click();}

function importPlanXLS(input){
  const file=input.files[0];
  if(!file){return;}

  if(typeof XLSX==='undefined'){showToast('Export library not loaded yet. Please try again.');input.value='';return;}

  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=new Uint8Array(e.target.result);
      const wb=XLSX.read(data,{type:'array',cellStyles:true,raw:false});
      const ws=wb.Sheets[wb.SheetNames[0]];

      const gv=(addr)=>{const cell=ws[addr];return cell?(cell.v!==undefined&&cell.v!==null?String(cell.v).trim():''):'';};

      // Validate it's an AO plan export
      const title=gv('A1');
      if(!title.includes('AO27')){
        showToast('File not recognised as an AO27 Materials Plan.');
        input.value='';return;
      }

      // Extract plan ID — value lives in B3 (label "PLAN_ID:" is in A3)
      const idCell=gv('B3');
      const idRow=gv('A3');
      const existingId=idCell?idCell:(idRow.startsWith('PLAN_ID:')?idRow.slice(8).trim():null);

      // Data integrity: if this upload is refreshing a specific plan loaded on the
      // Update tab, the Plan ID inside the file MUST match the one the user selected.
      // This prevents an edited spreadsheet from silently overwriting a different plan.
      if(S.xlsUpdateTargetId){
        const fileId=(existingId||'').trim().toUpperCase();
        const target=S.xlsUpdateTargetId.trim().toUpperCase();
        if(!fileId){
          showToast('This spreadsheet has no Plan ID, so it can\u2019t be matched. Upload the exported plan file.');
          input.value='';return;
        }
        if(fileId!==target){
          showToast('Plan ID mismatch: this file is '+fileId+', but you selected '+target+'. Upload the matching file.');
          input.value='';return;
        }
      }

      // Is this a brand-new TA migration upload (admin gate "Import existing record")?
      // If so, this is a NEW plan: the system generates the canonical id/Plan ID — never the file.
      const taUpload=!!(S.gate&&S.gate.mode==='import');

      // Find existing plan or create new
      let plan=null;
      let isUpdate=false;
      if(existingId){
        const stored=S.plans.find(p=>p.id===existingId);
        if(stored){plan=JSON.parse(JSON.stringify(stored));isUpdate=true;}
      }
      if(!plan)plan=newPlan();
      // Preserve the id from the file ONLY for a genuine cross-device re-import of an
      // existing, already-system-generated plan (so its permanent Plan ID survives).
      // A TA migration is a new plan, so it keeps the fresh uid() from newPlan().
      if(existingId&&!isUpdate&&!taUpload)plan.id=existingId;

      // ── Field length limits & sanitisation ──────────────────────────────
      const clamp=(v,max)=>String(v||'').slice(0,max);

      // Business details
      plan.profile.businessName = clamp(gv('B5'), 200);
      plan.profile.ownerName    = clamp(gv('D5'), 200);
      plan.profile.role         = clamp(gv('B6'), 100);
      plan.profile.email        = clamp(gv('D6'), 254);
      plan.profile.department   = clamp(gv('D7'), 100);
      plan.profile.date         = clamp(gv('B7'), 20);
      plan.profile.editorName   = clamp(gv('B8'), 200);
      plan.lastEditedBy         = clamp(gv('B8'), 200);
      plan.profile.wasteTarget  = clamp(gv('B11'), 300);
      plan.profile.reuseTarget  = clamp(gv('B12'), 300);
      plan.profile.storageDetails=clamp(gv('B13'), 500);
      // TA migration upload (from the gate "Import existing record" path):
      // role comes from the gate selection; the "Business" value maps to Department.
      if(taUpload){
        plan.roleType='TA';
        plan.profile.department=plan.profile.businessName||plan.profile.department||'';
      }

      // ── Header-driven column mapping (robust to column shifts/edits) ──
      const hmap={};
      'ABCDEFGHIJKLMNOPQRSTUVWX'.split('').forEach(function(c){
        const t=gv(c+'16').toLowerCase().replace(/\s+/g,' ').trim();
        if(t&&!(t in hmap))hmap[t]=c;
      });
      const findCol=function(incl,excl){
        excl=excl||[];
        for(const key in hmap){
          if(incl.every(function(t){return key.indexOf(t)>=0;})&&!excl.some(function(t){return key.indexOf(t)>=0;}))return hmap[key];
        }
        return null;
      };
      const COL={
        serial:   findCol(['serial']),
        assetNum: findCol(['asset','#']),
        prec:     findCol(['precinct'],['application']),
        assetName:findCol(['asset','item']),
        desc:     findCol(['description']),
        noItems:  findCol(['quantity'],['volume'])||findCol(['no. of items'])||findCol(['no of items']),
        tmlRef:   findCol(['tml']),
        matName:  findCol(['material name']),
        app:      findCol(['precinct','application']),
        vol:      findCol(['volume']),
        unit:     findCol(['unit']),
        stat:     findCol(['expected status'])||findCol(['status']),
        yearBuilt:findCol(['year built'])||findCol(['year']),
        outcome:  findCol(['actual outcome'])||findCol(['outcome']),
        builder:  findCol(['builder'])||findCol(['supplier']),
        drawing:  findCol(['drawing']),
        image:    findCol(['image']),
        comments: findCol(['comments'])
      };
      const cv=function(key,rr){const c=COL[key];return c?gv(c+rr):'';};
      const appNorm=function(v){if(!v)return'';const lo=String(v).toLowerCase().trim();for(let qi=0;qi<PREC_APPS_TA.length;qi++){if(PREC_APPS_TA[qi].toLowerCase()===lo)return PREC_APPS_TA[qi];}return v;};

      // ── Parse asset rows (data from row 17). Blank Asset# => each row is its own asset. ──
      const assetMap={};
      const assetOrder=[];
      let r=17;
      let emptyStreak=0;
      let lastPrec=''; // forward-fill: precinct is entered once per visual group, blank on rows below
      while(r<6000){
        const serialNumber=cv('serial',r);
        const assetNumRaw =cv('assetNum',r);
        const precRaw     =cv('prec',r);
        const prec        =precRaw||lastPrec;
        if(precRaw)lastPrec=precRaw;
        const assetName   =cv('assetName',r);
        const desc        =cv('desc',r);
        const noOfItems   =cv('noItems',r);
        const tmlRefRaw   =cv('tmlRef',r);
        const matName     =cv('matName',r);
        const app         =cv('app',r);
        const volRaw      =cv('vol',r);
        const vunit       =cv('unit',r);
        const stat        =cv('stat',r);
        const yearBuilt   =cv('yearBuilt',r);
        const outcome     =cv('outcome',r);
        const builder     =cv('builder',r);
        const drawing     =cv('drawing',r);
        const imageRef    =cv('image',r);
        const comments    =cv('comments',r);

        const hasContent=!!(serialNumber||assetNumRaw||precRaw||assetName||matName||desc||app||volRaw||vunit||stat||yearBuilt||outcome||noOfItems);
        if(!hasContent){emptyStreak++;if(emptyStreak>=3&&r>20)break;r++;continue;}
        emptyStreak=0;

        // Real Asset# groups multiple material rows; blank Asset# => one asset per row
        // TA migration: one row = one asset (flat inventory). Round-trip: group by Asset#.
        const key=(taUpload||!assetNumRaw)?('R:'+r):('A:'+assetNumRaw);
        if(!assetMap[key]){
          assetMap[key]={id:uid(),expanded:false,serialNumber:clamp(serialNumber,1000),assetId:clamp(assetNumRaw,100),
            prec:clamp(prec,100),precCustom:'',assetName:clamp(assetName,200),desc:clamp(desc,500),
            noOfItems:clamp(noOfItems,30),yearBuilt:clamp(yearBuilt,20),
            builderSupplier:clamp(builder,200),drawingRef:clamp(drawing,100),imageRef:clamp(imageRef,200),comments:clamp(comments,500),materials:[]};
          assetOrder.push(key);
        }
        // Volume may be dimensions/text, not just a number — keep numeric if it parses, else keep trimmed text
        const volNum=parseFloat(volRaw);
        const volSafe=(volRaw&&!isNaN(volNum))?String(Math.max(0,volNum)):clamp(volRaw,40);
        // TA migration default: route every material to 5a (custom name) unless a real TML ref exists
        const tmlRef=(taUpload&&!tmlRefRaw)?'OTHER':clamp(tmlRefRaw,10);
        // Field 5a (material name) maps to Material Name (col I)
        assetMap[key].materials.push(
          {id:uid(),cat:'',app:clamp(taUpload?appNorm(app):app,150),tmlRef:tmlRef,name:clamp(matName,200),
           vol:volSafe,vunit:clamp(vunit,20),stat:clamp(stat,100),outcome:clamp(outcome,100)}
        );
        r++;
      }
      plan.assets=assetOrder.map(function(n){return assetMap[n];});
      const lastDataRow=r;

      // Parse audit rows 53 onwards
      const existingAudit=plan.audit||[];
      let arow=Math.max(53,lastDataRow+1);
      const importedAudit=[];
      while(arow<200){
        const who=gv('A'+arow);
        const action=gv('B'+arow);
        if(!who&&!action)break;
        importedAudit.push({who,action:action||'Updated plan',when:0});
        arow++;
      }
      // Merge: keep existing audit, add import notice
      plan.audit=existingAudit;
      plan.lastEditedAt=Date.now();
      plan.lastEditedBy=plan.profile.editorName||plan.profile.ownerName||'Unknown';
      if(!plan.audit)plan.audit=[];
      plan.audit.push({
        who:plan.lastEditedBy,
        action:isUpdate?'Updated plan from XLS import':'Imported from XLS',
        when:Date.now()
      });

      // Save and load
      storageSave(plan);
      const idx=S.plans.findIndex(p=>p.id===plan.id);
      if(idx>=0)S.plans[idx]=JSON.parse(JSON.stringify(plan));
      else S.plans.unshift(JSON.parse(JSON.stringify(plan)));

      plan.imported=true;
      S.plan=plan;
      S.screen='form';
      S.plan.step=2; // Go to summary to review
      S._unsaved=true; // imported plan should still be saved via savePlan to cloud
      sendPlanEmail(plan, !isUpdate); // send email: created if not an update
      showToast(isUpdate?'Plan updated from XLS':'Plan imported from XLS');
      S.xlsUpdateTargetId=null; // consume the update-target guard
      render();
    }catch(err){
      console.error('Import error:',err);
      showToast('Import failed - check the file format');
    }
    input.value='';
  };
  reader.readAsArrayBuffer(file);
}



function loadXLSXThen(cb){
  if(typeof XLSX!=='undefined'){cb();return;}
  showToast('Loading export library…');
  const s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  s.onload=function(){if(typeof XLSX!=='undefined')cb();else showToast('Export library failed to load — check your connection.');};
  s.onerror=function(){showToast('Export library failed to load — check your connection.');};

}

  const s=document.createElement('script');

  s.onerror=function(){showToast('Export library failed to load.');};

}
function exportPlanXLS(){
  loadJSZipThen(function(){_doExportXLS().catch(function(err){showToast('Export failed \u2014 '+err.message);});});
}

async function _doExportXLS(){
  const plan=S.plan;
  const p=plan.profile;
  const assets=plan.assets||[];
  try{
    showToast('Preparing export\u2026');
    const bytes=Uint8Array.from(atob(XLSX_TEMPLATE_B64),ch=>ch.charCodeAt(0));
    const zip=await JSZip.loadAsync(bytes);

    // XML-safe escape
    const esc=v=>String(v==null?'':v)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

    // Inline string cell — safe for sheet1 (no Table)
    const ic=(ref,s,val)=>{
      const v=esc(String(val==null?'':val));
      return v
        ?'<c r="'+ref+'" s="'+s+'" t="inlineStr"><is><t>'+v+'</t></is></c>'
        :'<c r="'+ref+'" s="'+s+'"/>';
    };

    // Replace one cell in XML, preserving s= style attribute
    const replCell=(xml,ref,sIdx,val)=>{
      const re=new RegExp('<c r="'+ref+'" s="'+sIdx+'"(?:\\s[^>]*)?(?:/>|>[\\s\\S]*?</c>)');
      const r=ic(ref,sIdx,val);
      const out=xml.replace(re,r);
      if(out===xml){
        const rowRe=new RegExp('(<row r="'+(ref.replace(/[A-Z]+/,''))+'\"[^>]*>)');
        return xml.replace(rowRe,'$1'+r);
      }
      return out;
    };

    // ── SHEET 1: AO Materials Mgt ────────────────────────────────────────────
    let s1=await zip.file('xl/worksheets/sheet1.xml').async('string');

    // Business header (styles match the current template's cells)
    // PLAN_ID: write as-is if already in AO27-XXXX-XXXX form, else derive it (avoids double-encoding)
    const planIdOut=/^AO27-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(plan.id||'')?plan.id:planCode(plan.id);
    s1=replCell(s1,'B3',28,planIdOut);
    s1=replCell(s1,'B5',2,p.businessName||'');
    s1=replCell(s1,'D5',2,p.ownerName||'');
    s1=replCell(s1,'B6',2,p.role||'');
    s1=replCell(s1,'D6',29,p.email||'');
    s1=replCell(s1,'B7',2,p.date||'');
    s1=replCell(s1,'B8',15,plan.lastEditedBy||p.editorName||'');
    s1=replCell(s1,'D8',15,
      plan.lastEditedAt?new Date(plan.lastEditedAt).toLocaleDateString('en-AU'):(p.date||''));
    s1=replCell(s1,'B11',42,p.wasteTarget||'');
    s1=replCell(s1,'B12',42,p.reuseTarget||'');
    s1=replCell(s1,'B13',42,p.storageDetails||'');

    // Tidy row 15: clear any leftover instructional text / stray-space placeholders,
    // leaving the row blank above the header (matches the clean header layout).
    ['A15','B15','C15','J15','M15'].forEach(ref=>{
      s1=s1.replace(new RegExp('<c r="'+ref+'"[^>]*?(?:/>|>[\\s\\S]*?</c>)'),
        m=>{const sm=m.match(/s="(\d+)"/);return '<c r="'+ref+'" s="'+(sm?sm[1]:'0')+'"/>';});
    });

    // Strip any existing data rows (17+) so the export contains only this plan's data
    s1=s1.replace(/<row r="(?:1[7-9]|[2-9]\d|\d{3,})"[^>]*>[\s\S]*?<\/row>/g,'');

    // Column map (A..S) — matches the import header layout exactly for round-trip:
    // A Serial, B Asset ID, C Precinct, D Asset/Item, E Description, F Quantity (No. of items),
    // G No. of Materials (auto), H TML Ref, I Material Name, J Precinct Application, K Volume,
    // L Unit, M Expected Status, N Year built, O Actual Outcome, P Builder/supplier,
    // Q Image Ref, R Drawing Ref, S Comments
    const COLS=['A','B','C','D','E','F','G','H','I','J','K','L','M','N','O','P','Q','R','S'];
    const dataStyle=ci=>(ci===4||ci===9)?20:9;  // E (Description) and J (Precinct Application) wrap-text style
    let rowIdx=17;
    let rowsXml='';
    for(let ai=0;ai<assets.length;ai++){
      const a=assets[ai];
      const mats=a.materials||[];
      const matCount=mats.length;
      for(let mi=0;mi<matCount;mi++){
        const m=mats[mi];
        const vals=[
          a.serialNumber||'',         // A Serial number
          a.assetId||'',              // B Asset ID (Asset #)
          a.prec||'',                 // C Precinct
          a.assetName||'',            // D Asset / Item
          a.desc||'',                 // E Description
          a.noOfItems||'',            // F Quantity (No. of items, asset details)
          matCount,                   // G No. of Materials (auto-generated)
          m.tmlRef||'',               // H TML Ref
          m.name||'',                 // I Material Name
          m.app||'',                  // J Precinct Application
          m.vol||'',                  // K Volume
          m.vunit||'',                // L Unit
          m.stat||'',                 // M Expected Status
          a.yearBuilt||'',            // N Year built
          m.outcome||'',              // O Actual Outcome
          a.builderSupplier||'',      // P Builder / supplier
          a.imageRef||'',             // Q Image Ref
          a.drawingRef||'',           // R Drawing Ref
          a.comments||''              // S Comments
        ];
        let cells='';
        for(let ci=0;ci<19;ci++)cells+=ic(COLS[ci]+rowIdx,dataStyle(ci),vals[ci]);
        rowsXml+='<row r="'+rowIdx+'" spans="1:19" x14ac:dyDescent="0.35">'+cells+'</row>';
        rowIdx++;
      }
    }
    s1=s1.replace('</sheetData>',rowsXml+'</sheetData>');
    s1=s1.replace(/ref="A1:[A-Z]+\d+"/,'ref="A1:S'+Math.max(16,rowIdx-1)+'"');
    zip.file('xl/worksheets/sheet1.xml',s1);

    // ── SHARED STRINGS — needed for sheet2 (has Excel Table, requires t="s") ──
    // t="inlineStr" is rejected inside Tables; must use shared string references.
    let ssXml=await zip.file('xl/sharedStrings.xml').async('string');
    const existingCount=parseInt((ssXml.match(/count="(\d+)"/) ||[0,'0'])[1]);
    const existingUnique=parseInt((ssXml.match(/uniqueCount="(\d+)"/) ||[0,'0'])[1]);
    const newSS=[];

    // Build a shared-string cell — appends value to sharedStrings and refs by index
    const ssc=(ref,sIdx,val)=>{
      const v=String(val==null?'':val);
      if(!v) return '<c r="'+ref+'" s="'+sIdx+'"/>';
      const escaped=esc(v);
      const idx=existingUnique+newSS.length;
      newSS.push('<si><t xml:space="preserve">'+escaped+'</t></si>');
      return '<c r="'+ref+'" s="'+sIdx+'" t="s"><v>'+idx+'</v></c>';
    };

    // ── SHEET 2: Customer Assets ─────────────────────────────────────────────────
    // One row per asset. Only two fields populated from the plan:
    //   E = Descriptive Name  ← Asset / Item name (step 2)
    //   K = Department        ← Department from Business Details
    // All other columns (category, location, etc.) left blank for manual entry.
    // L column (Owner VLOOKUP formula) is intentionally never touched.
    let s2=await zip.file('xl/worksheets/sheet2.xml').async('string');
    let r2=3;
    for(let ai=0;ai<assets.length;ai++){
      const a=assets[ai];
      if(!(a.assetName||'').trim()) continue;  // skip empty asset rows
      const si=r2%2===0?8:7;
      const pairs=[
        ['E', a.assetName||''],          // Descriptive Name = Asset / Item
        ['K', p.department||''],         // Department from Business Details
      ];
      for(const[col,val]of pairs){
        const ref=col+r2;
        const re=new RegExp('<c r="'+ref+'" s="'+si+'"(?:\\s[^>]*)?(?:/>|>[\\s\\S]*?</c>)');
        s2=s2.replace(re,ssc(ref,si,val));
      }
      r2++;
    }
    zip.file('xl/worksheets/sheet2.xml',s2);

    // Update sharedStrings.xml with all newly added strings
    if(newSS.length>0){
      const total=existingCount+newSS.length;
      const unique=existingUnique+newSS.length;
      ssXml=ssXml.replace('</sst>',newSS.join('')+'</sst>');
      ssXml=ssXml.replace(/count="\d+"/,`count="${total}"`);
      ssXml=ssXml.replace(/uniqueCount="\d+"/,`uniqueCount="${unique}"`);
      zip.file('xl/sharedStrings.xml',ssXml);
    }

    // ── CALCHAIN — remove cleanly so Excel regenerates it (avoids repair error) ─
    // calcChain.xml caches formula calc order; its absence is fine — Excel rebuilds.
    zip.remove('xl/calcChain.xml');
    // Remove from [Content_Types].xml
    let ct=await zip.file('[Content_Types].xml').async('string');
    ct=ct.replace(/<Override[^>]*calcChain[^>]*\/>/g,'');
    zip.file('[Content_Types].xml',ct);
    // Remove relationship from workbook.xml.rels
    let wbRels=await zip.file('xl/_rels/workbook.xml.rels').async('string');
    wbRels=wbRels.replace(/<Relationship[^>]*calcChain[^>]*\/>/g,'');
    zip.file('xl/_rels/workbook.xml.rels',wbRels);

    // ── Download ──────────────────────────────────────────────────────────────
    const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',
      compressionOptions:{level:6}});
    const url=URL.createObjectURL(blob);
    const fname=(p.businessName||'AO27_Plan').replace(/[^a-z0-9]/gi,'_')+'_Materials_Plan.xlsx';
    const a=document.createElement('a');
    a.href=url;a.download=fname;
    document.body.appendChild(a);a.click();
    setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},200);
    showToast('Exported \u2713');

  }catch(err){
    console.error('Export error:',err);
    showToast('Export failed \u2014 '+err.message);
  }
}

// ── Unsaved-changes guard ─────────────────────────────────────────────────────
function confirmLeaveIfUnsaved(proceedFn){
  // Show inline warning banner on summary page instead of browser dialog
  const existing=document.getElementById('unsaved-warn');
  if(existing){existing.remove();}
  const warn=document.createElement('div');
  warn.id='unsaved-warn';
  warn.style.cssText='position:fixed;bottom:0;left:0;right:0;z-index:998;background:#FAEEDA;border-top:2px solid #EF9F27;padding:12px 1rem;display:flex;align-items:center;gap:10px;justify-content:space-between;box-shadow:0 -4px 16px rgba(0,0,0,.1)';
  warn.innerHTML='<div style="font-size:13px;color:#854F0B;font-weight:600">⚠ You have unsaved changes. Save your plan before leaving so you can return to it.</div>'
    +'<div style="display:flex;gap:8px;flex-shrink:0">'
    +'<button id="unsaved-leave-btn" style="font-size:12px;padding:7px 14px;border:1px solid #c9a87a;background:#fff;color:#854F0B;border-radius:7px;cursor:pointer">Leave without saving</button>'
    +'<button onclick="savePlan();document.getElementById(\'unsaved-warn\').remove();" style="font-size:12px;padding:7px 14px;background:#0091D2;color:#fff;border:none;border-radius:7px;cursor:pointer;font-weight:700">Save now</button>'
    +'</div>';
  document.body.appendChild(warn);
  document.getElementById('unsaved-leave-btn').onclick=function(){
    warn.remove();
    proceedFn();
  };
}

function goHome(){
  if(S.screen==='form'&&S.plan&&S.plan.step===2&&S._unsaved&&!S.plan._example){
    confirmLeaveIfUnsaved(()=>{S._unsaved=false;S.screen='home';render();});
    return;
  }
  S.screen='home';render();
}

function closeSupportModal(){const m=document.getElementById('support-modal');if(m)m.remove();}
function submitSupport(){
  const name=(document.getElementById('sup-name').value||'').trim();
  const biz=(document.getElementById('sup-biz').value||'').trim();
  const email=(document.getElementById('sup-email').value||'').trim();
  const msg=(document.getElementById('sup-msg').value||'').trim();
  const err=document.getElementById('sup-err');
  if(!name||!biz||!email){err.textContent='Please complete name, business name and email.';return;}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){err.textContent='Please enter a valid email address.';return;}
  const subject='Materials list upload support request';
  const body='Name: '+name+'\nBusiness: '+biz+'\nEmail: '+email+'\n\nMessage:\n'+(msg||'(none)');
  window.location.href='mailto:meg@esgfuture.net?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
  closeSupportModal();
  if(typeof showToast==='function')showToast('Opening your email to send the request to the AO Waste team.');
}

function createNewPlan(){S.plan=newPlan();S._unsaved=false;S.screen='form';render();}
function loadExample(){S.plan=Object.assign(examplePlan(),{_example:true});S.screen='form';render();}
function goNext(){
  if(S.plan.step===0)saveAbout();
  if(S.plan._aboutInvalid)return;
  if(S.plan.step===1){
    // Validate assets before advancing to summary
    const assets=S.plan.assets||[];
    if(!assets.length){showToast('Add at least one asset before continuing.');return;}
    const errors=[];
    // Mandatory fields are OFF for: TA branch (upload/internal), imported plans, and the example/demo plan.
    // Agency / Builder / Partner NEW plans remain fully validated.
    const isTArole=TA_ROLES.includes((S.plan.profile.role)||'')||S.plan.roleType==='TA';
    const lenient=isTArole||S.plan.imported||S.plan._example;
    assets.forEach((a,i)=>{
      const label='Asset '+(i+1)+(a.assetName?' ('+a.assetName+')':'');
      if(!a.prec&&!lenient)errors.push(label+': Precinct is required');
      if(!a.assetName&&!lenient)errors.push(label+': Asset name is required');
      a.materials.forEach((m,j)=>{
        const ml=label+', Material '+(j+1);
        if(j===0&&!a.materials[0].app&&!lenient)errors.push(label+': Precinct application (field 4) is required');
        if(!m.tmlRef&&!lenient)errors.push(ml+': Select a material from the AO Target Materials List or choose "Not AO target material" (field 6)');
        if(m.tmlRef==='OTHER'&&!m.name&&!lenient)errors.push(ml+': Material name required at 6a');
        if(!m.stat&&!lenient)errors.push(ml+': Expected status (field 7) is required');
      });
    });
    if(errors.length){
      showToast(errors.length+' required field'+(errors.length>1?'s':'')+' missing — check assets');
      console.warn('Asset validation errors:',errors);
      return;
    }
  }
  if(S.plan.step<2){S.plan.step++;if(S.plan.step>=1)S._unsaved=true;render();}
}
function goPrev(){
  if(S.plan.step===2&&S._unsaved&&!S.plan._example){
    confirmLeaveIfUnsaved(()=>{S.plan.step--;render();});
    return;
  }
  if(S.plan.step>0){S.plan.step--;render();}
}
function deletePlan(id){
  // Find the plan so we can show its name in the confirmation
  const p=S.plans.find(x=>x.id===id);
  const planLabel=p?(p.profile&&p.profile.businessName?p.profile.businessName+' — ':'')+(planCode(id)):'this plan';

  // Remove any existing modal
  const ex=document.getElementById('delete-confirm-modal');if(ex)ex.remove();

  const overlay=document.createElement('div');
  overlay.id='delete-confirm-modal';
  overlay.style.cssText='position:fixed;inset:0;background:rgba(10,34,64,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:1rem';

  const box=document.createElement('div');
  box.style.cssText='background:#fff;border-radius:14px;padding:1.75rem;max-width:360px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)';
  box.innerHTML=`
    <div style="font-size:22px;text-align:center;margin-bottom:.75rem">🗑️</div>
    <div style="font-size:16px;font-weight:800;color:#003A5D;margin-bottom:.4rem;text-align:center">Delete plan?</div>
    <div style="font-size:13px;color:#555;line-height:1.6;margin-bottom:1.25rem;text-align:center">
      <strong style="color:#1a1a1a">${esc(planLabel)}</strong><br>
      This cannot be undone. Type <strong>DELETE</strong> below to confirm.
    </div>
    <input id="delete-confirm-input" type="text" placeholder="Type DELETE to confirm"
      style="width:100%;padding:9px 12px;border:1.5px solid #ddd;border-radius:8px;font-size:13px;font-family:inherit;margin-bottom:12px;outline:none;text-transform:uppercase">
    <div style="display:flex;gap:8px">
      <button id="delete-cancel-btn" style="flex:1;padding:10px;background:#f5f5f3;color:#555;border:1px solid #ddd;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit">Cancel</button>
      <button id="delete-confirm-btn" style="flex:1;padding:10px;background:#A32D2D;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;opacity:.4" disabled>Delete permanently</button>
    </div>`;

  overlay.appendChild(box);
  document.body.appendChild(overlay);

  const input=document.getElementById('delete-confirm-input');
  const confirmBtn=document.getElementById('delete-confirm-btn');
  const cancelBtn=document.getElementById('delete-cancel-btn');

  input.addEventListener('input',function(){
    const ok=this.value.trim().toUpperCase()==='DELETE';
    confirmBtn.disabled=!ok;
    confirmBtn.style.opacity=ok?'1':'.4';
  });
  cancelBtn.onclick=function(){overlay.remove();};
  overlay.addEventListener('click',function(e){if(e.target===overlay)overlay.remove();});
  confirmBtn.onclick=function(){
    overlay.remove();
    storageDel(id);
    S.plans=S.plans.filter(p=>p.id!==id);
    render();
    showToast('Plan deleted');
  };
  // Focus the input for keyboard users
  setTimeout(()=>input.focus(),50);
}
function savePlan(){
  if(S.plan._example){showToast('Example plans cannot be saved');return;}
  const editor=S.plan.profile.editorName||S.plan.profile.ownerName||'Unknown';
  const now=Date.now();
  if(!S.plan.audit)S.plan.audit=[];
  if(!S.plan.createdAt)S.plan.createdAt=now;
  S.plan.lastEditedBy=editor;
  S.plan.lastEditedAt=now;
  S.plan.audit.push({who:editor,when:now,action:'Saved plan'});

  // Detect new vs update BEFORE saving (so we can send the right email)
  const isNew = S.plans.findIndex(p=>p.id===S.plan.id) < 0;

  planDB.save(S.plan).then(res=>{
    const i=S.plans.findIndex(p=>p.id===S.plan.id);
    if(i>=0)S.plans[i]=JSON.parse(JSON.stringify(S.plan));
    else S.plans.unshift(JSON.parse(JSON.stringify(S.plan)));
    if(res.ok){
      S._unsaved=false; // clear dirty flag
      const warnBanner=document.getElementById('unsaved-warn');
      if(warnBanner)warnBanner.remove();
      const badge=document.getElementById('unsaved-badge');
      if(badge)badge.remove();
      showSavedModal(planCode(S.plan.id), res.source);
      sendPlanEmail(S.plan, isNew); // fire-and-forget email confirmation
    } else {
      showToast('Save failed - please try again');
    }
  });
}

  const srcNote=document.getElementById('save-source-note');

    }
  }
  m.addEventListener('click',function(e){if(e.target===m)m.remove();});

// ── Asset CRUD ────────────────────────────────────────────────────────────────
function addAsset(){
  S.plan.assets.push(newAsset({expanded:true}));
  refreshAssets();
  setTimeout(()=>{const els=document.querySelectorAll('.acard-bd');if(els.length)els[els.length-1].scrollIntoView({behavior:'smooth',block:'nearest'})},80);
}
function delAsset(aid){
  S.plan.assets=S.plan.assets.filter(a=>a.id!==aid);
  refreshAssets();
}
function toggleAsset(aid){
  const a=S.plan.assets.find(x=>x.id===aid);if(!a)return;
  a.expanded=!a.expanded;
  const bd=document.getElementById('abd-'+aid);const arr=document.getElementById('arr-'+aid);
  if(bd)bd.style.display=a.expanded?'':'none';
  if(arr)arr.innerHTML=a.expanded?'&#9650;':'&#9660;';
}

function saveAsset(aid){
  const ok=storageSave(S.plan);
  if(ok){const i=S.plans.findIndex(p=>p.id===S.plan.id);if(i>=0)S.plans[i]=JSON.parse(JSON.stringify(S.plan));else S.plans.unshift(JSON.parse(JSON.stringify(S.plan)));showToast('Asset saved \u2713');}
  else showToast('Save failed - please try again');
}

// ── Asset-level field update ──────────────────────────────────────────────────
function upAsset(el){
  const aid=el.dataset.aid;const f=el.dataset.f;
  const a=S.plan.assets.find(x=>x.id===aid);if(!a)return;
  a[f]=el.value;
  // Update header name
  const nm=document.querySelector('#ac-'+aid+' .aname');
  if(nm){const precLabel=a.prec||'';nm.textContent=a.assetName||precLabel||'New asset';}
  // Update score bar
  const assets=S.plan.assets||[];const sc=calcScore(assets);const cl=fillClr(sc.pct);
  const allMatsCount=assets.flatMap(a=>a.materials||[]).length;
  const sb=document.getElementById('score-bar');
  if(sb)sb.innerHTML=`<div style="display:flex;justify-content:space-between;font-size:12px;color:#888;margin-bottom:4px"><span>${assets.length} asset${assets.length!==1?'s':''} &middot; ${allMatsCount} material${allMatsCount!==1?'s':''} &middot; ${sc.nonLandfill} diverted from landfill</span><span style="font-weight:600;color:${cl}">${sc.total>0?sc.pct+'% circular':''}</span></div><div class="strack"><div class="sfill" style="width:${sc.pct}%;background:${cl}"></div></div>`;
}

// ── Material-level field update ───────────────────────────────────────────────
function toggleOutcomeOther(sel,aid,mid){
  const span=document.getElementById('outcome-other-'+aid+'-'+mid);
  if(span)span.style.display=sel.value==='Other'?'block':'none';
}

function upAssetMat(el){
  const aid=el.dataset.aid;const mid=el.dataset.mid;const f=el.dataset.f;
  const a=S.plan.assets.find(x=>x.id===aid);if(!a)return;
  const m=a.materials.find(x=>x.id===mid);if(!m)return;
  m[f]=el.value;
  // Update material row header label
  const hd=document.querySelector('#mr-'+mid+' .mat-row-name');
  if(hd)hd.textContent=m.name||m.cat||'Material';
  // Refresh circ badge in asset header when stat changes
  if(f==='stat'){
    const circEl=document.querySelector('#ac-'+aid+' .acard-hd span[style*="color"]');
    if(circEl){const newCirc=assetCirc(a);const tmp=document.createElement('div');tmp.innerHTML=newCirc;if(tmp.firstChild)circEl.replaceWith(tmp.firstChild);}
    // Update score bar
    const assets=S.plan.assets||[];const sc=calcScore(assets);const cl=fillClr(sc.pct);
    const allMatsCount=assets.flatMap(x=>x.materials||[]).length;
    const sb=document.getElementById('score-bar');
    if(sb)sb.innerHTML=`<div style="display:flex;justify-content:space-between;font-size:12px;color:#888;margin-bottom:4px"><span>${assets.length} asset${assets.length!==1?'s':''} &middot; ${allMatsCount} material${allMatsCount!==1?'s':''} &middot; ${sc.nonLandfill} diverted from landfill</span><span style="font-weight:600;color:${cl}">${sc.total>0?sc.pct+'% circular':''}</span></div><div class="strack"><div class="sfill" style="width:${sc.pct}%;background:${cl}"></div></div>`;
  }
}

// ── TML pick (within asset mat) ───────────────────────────────────────────────
function pickAssetMatTML(el){
  const aid=el.dataset.aid;const mid=el.dataset.mid;const val=el.value;
  const a=S.plan.assets.find(x=>x.id===aid);if(!a)return;
  const m=a.materials.find(x=>x.id===mid);if(!m)return;

  if(val===''){
    m.tmlRef='';m.name='';
    refreshAssets();return;
  }
  if(val==='OTHER'){
    m.tmlRef='OTHER';m.name='';
    // Show field 7, hide TML info
    const f7=document.getElementById('f7-'+mid);if(f7)f7.style.display='';
    const hd=document.querySelector('#mr-'+mid+' .mat-row-name');if(hd)hd.textContent='Other material';
    return;
  }
  const t=TML.find(x=>x.ref===val);if(!t)return;
  m.tmlRef=val;m.name=t.name;m.cat=t.cat;
  refreshAssets();
}

// ── Asset material CRUD ───────────────────────────────────────────────────────
function addAssetMat(aid){
  const a=S.plan.assets.find(x=>x.id===aid);if(!a)return;
  a.materials.push(newAssetMat());
  // Re-render just the materials section for this asset
  const mats=document.getElementById('mats-'+aid);
  if(mats){let h='';for(let j=0;j<a.materials.length;j++)h+=matRowHtml(aid,a.materials[j],j);mats.innerHTML=h;}
  // Update materials count label
  const lbl=document.querySelector('#ac-'+aid+' .mats-divider-lbl');
  if(lbl)lbl.textContent=`Materials in this asset (${a.materials.length})`;
  // Update mat badge in header
  const hd=document.querySelector('#ac-'+aid+' .acard-hd');
  const matBdgEl=hd?hd.querySelector('.bdg.gy'):null;
  if(matBdgEl&&a.materials.length>1)matBdgEl.textContent=`${a.materials.length} mats`;
  else if(!matBdgEl&&a.materials.length>1&&hd){const nb=document.createElement('span');nb.className='bdg gy';nb.style.fontSize='10px';nb.textContent=`${a.materials.length} mats`;hd.insertBefore(nb,hd.querySelector('.aname'));}
  // Scroll to new row
  setTimeout(()=>{const rows=mats?mats.querySelectorAll('.mat-row'):[];if(rows.length)rows[rows.length-1].scrollIntoView({behavior:'smooth',block:'nearest'})},50);
}

function delAssetMat(aid,mid){
  const a=S.plan.assets.find(x=>x.id===aid);if(!a)return;
  if(a.materials.length<=1){showToast('An asset needs at least one material. Delete the asset to remove it entirely.');return;}
  a.materials=a.materials.filter(m=>m.id!==mid);
  const mats=document.getElementById('mats-'+aid);
  if(mats){let h='';for(let j=0;j<a.materials.length;j++)h+=matRowHtml(aid,a.materials[j],j);mats.innerHTML=h;}
  const lbl=document.querySelector('#ac-'+aid+' .mats-divider-lbl');
  if(lbl)lbl.textContent=`Materials in this asset (${a.materials.length})`;
}

// ── Init ──────────────────────────────────────────────────────────────────────
function init(){
  const raw=storageLoadAll();
  S.plans=raw.map(migratePlan);
  S.screen='home';render();
  // Background TML sync — fetches latest data from Materials_Methods_Plan repo.
  // Re-renders if TML changed so any open Step 5 reflects fresh data.
  syncRemoteTML().then(()=>{
    if(S.screen==='form'&&S.plan&&S.plan.step===4) render();
  });
}
init();
